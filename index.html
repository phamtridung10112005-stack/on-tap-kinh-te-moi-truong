là một trong những nước chịu ảnh hưởng nặng nhất của biến đổi khí hậu, đồng thời phát thải CO2 đang tăng."}, {"n": 211, "q": "Khi đánh giá tính khả thi của việc lồng ghép các mục tiêu phát triển bền vững vào kế hoạch cấp tỉnh, khó khăn lớn nhất là:", "o": ["Thiếu nhân sự có chuyên môn về phát triển bền vững", "Cách hiểu khác nhau về mục tiêu phát triển bền vững giữa các địa phương", "Thiếu khung hướng dẫn cụ thể và công cụ đo lường phù hợp", "Không có kinh phí triển khai các mục tiêu này"], "a": [2], "e": "Khó khăn lớn nhất khi lồng ghép SDGs vào kế hoạch cấp tỉnh là thiếu hướng dẫn cụ thể và bộ chỉ số đo lường phù hợp."}, {"n": 212, "q": "Khi so sánh mục tiêu “tăng trưởng xanh” và “kinh tế tuần hoàn” trong chiến lược phát triển bền vững, điểm giống nhau quan trọng nhất là:", "o": ["Cả hai đều yêu cầu giảm chi tiêu ngân sách.", "Cả hai đều nhấn mạnh cải thiện năng suất lao động.", "Đều tập trung vào nâng cao hiệu quả sử dụng tài nguyên và giảm tác động môi trường.", "Đều tập trung vào nâng cao hiệu quả nguồn vốn trong phát triển kinh tế và giảm rủi ro môi trường."], "a": [2], "e": "Tăng trưởng xanh và kinh tế tuần hoàn đều hướng đến dùng tài nguyên hiệu quả và giảm tác động môi trường."}, {"n": 213, "q": "Vì sao chính sách thuế các-bon được coi là một công cụ quan trọng trong phát triển bền vững?", "o": ["Giúp giảm ô nhiễm môi trường và tăng thu ngân sách", "Góp phần giảm phát thải và tăng thu ngân sách", "Tăng chi tiêu tiêu dùng", "Thúc đẩy nhập khẩu nhiên liệu"], "a": [1], "e": "Thuế các-bon làm phát thải tốn tiền hơn → doanh nghiệp giảm phát thải; đồng thời tạo nguồn thu ngân sách."}, {"n": 214, "q": "So với giai đoạn trước, điểm đổi mới của Chiến lược phát triển bền vững Việt Nam giai đoạn 2021–2030 là gì?", "o": ["Tập trung phát triển công nghiệp và xuất khẩu gắn liền với bảo vệ môi trường và đảm bảo công bằng xã hội", "Tăng vai trò của các doanh nghiệp nhà nước trong điều phối phát triển bền vững.", "Gắn chặt với 17 mục tiêu SDGs (Sustainable Development Goals) toàn cầu và xác định rõ trách nhiệm của các cấp, ngành.", "Tách riêng yếu tố môi trường ra khỏi chiến lược chung"], "a": [2], "e": "Chiến lược 2021–2030 gắn chặt với 17 mục tiêu SDGs toàn cầu và phân rõ trách nhiệm các cấp, ngành."}];
const $ = id => document.getElementById(id);
const L = 'ABCD';
const store = {
  get(k){ try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch { return new Set(); } },
  set(k, s){ try { localStorage.setItem(k, JSON.stringify([...s])); } catch {} }
};
let wrongAll = store.get('ktmt_wrong'), hidden = store.get('ktmt_hidden'), list = [], i = 0, correct = 0, wrongNow = [], answered = false;

function shuffle(a){ a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function show(id){ for (const s of ['home','quiz','result']) $(s).classList.toggle('hidden', s !== id); window.scrollTo(0, 0); }
const visible = () => DATA.filter(q => !hidden.has(q.n));
function refreshHome(){
  const wrongVisible = visible().filter(q => wrongAll.has(q.n)).length;
  $('nwrong').textContent = wrongVisible; $('redo').disabled = !wrongVisible;
  $('nhidden').textContent = hidden.size; $('unhide').disabled = !hidden.size;
  $('total').textContent = `${DATA.length} câu hỏi trắc nghiệm` + (hidden.size ? ` · đang ẩn ${hidden.size} câu đã thuộc` : '');
  $('start').disabled = !visible().length;
}

function start(qs){
  const shuf = $('shuf').checked;
  list = qs.map(q => ({ q, order: shuf ? shuffle([0,1,2,3]) : [0,1,2,3] }));
  i = 0; correct = 0; wrongNow = [];
  show('quiz'); render();
}
function render(){
  const { q, order } = list[i];
  answered = false;
  $('pos').textContent = `Câu ${i + 1}/${list.length}`;
  $('live').textContent = `Đúng ${correct}/${i}`;
  $('prog').style.width = (i / list.length * 100) + '%';
  $('qnum').textContent = `Câu ${q.n} trong đề`;
  $('qtext').textContent = q.q;
  $('opts').innerHTML = '';
  order.forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<b>${L[k]}.</b>`;
    b.append(q.o[oi]);
    b.onclick = () => pick(oi);
    b.dataset.oi = oi;
    $('opts').append(b);
  });
  $('exp').classList.add('hidden');
  $('expText').textContent = q.e;
  $('hideQ').checked = hidden.has(q.n);
  $('next').disabled = true;
  $('next').textContent = i + 1 < list.length ? 'Câu tiếp →' : 'Xem kết quả';
}
function pick(oi){
  if (answered) return;
  answered = true;
  const q = list[i].q, ok = q.a.includes(oi);
  for (const b of $('opts').children) {
    const v = +b.dataset.oi;
    if (q.a.includes(v)) b.classList.add('ok');
    else if (v === oi) b.classList.add('bad');
    b.disabled = !q.a.includes(v) && v !== oi;
  }
  if (ok) { correct++; wrongAll.delete(q.n); }
  else { wrongNow.push({ q, oi }); wrongAll.add(q.n); }
  store.set('ktmt_wrong', wrongAll);
  $('exp').classList.remove('hidden');
  $('live').textContent = `Đúng ${correct}/${i + 1}`;
  $('next').disabled = false;
  $('next').focus();
}
function next(){ if (!answered) return; if (++i < list.length) render(); else finish(); }
function finish(){
  const done = answered ? i + (i < list.length ? 1 : 0) : i;
  const n = Math.min(done, list.length);
  $('score').textContent = `${correct}/${n}`;
  $('scoreTxt').textContent = n ? `Đúng ${Math.round(correct / n * 100)}%` : 'Chưa làm câu nào';
  $('retryWrong').disabled = !wrongNow.length;
  const r = $('review');
  r.innerHTML = wrongNow.length ? '<b>Các câu làm sai</b>' : '<b>Không sai câu nào 🎉</b>';
  for (const { q, oi } of wrongNow) {
    const d = document.createElement('div'); d.className = 'wrong';
    const t = document.createElement('div'); t.textContent = `Câu ${q.n}: ${q.q}`; t.style.fontWeight = 600;
    const y = document.createElement('div'); y.className = 'muted'; y.textContent = 'Bạn chọn: ' + q.o[oi];
    const a = document.createElement('div'); a.className = 'a'; a.textContent = 'Đáp án: ' + q.a.map(k => q.o[k]).join(' / ');
    const e = document.createElement('div'); e.className = 'muted'; e.textContent = 'Giải thích: ' + q.e;
    d.append(t, y, a, e); r.append(d);
  }
  show('result'); refreshHome();
}

$('start').onclick = () => {
  let qs = $('order').value === 'rand' ? shuffle(visible()) : visible();
  const c = $('count').value; if (c !== 'all') qs = qs.slice(0, +c);
  start(qs);
};
$('redo').onclick = () => start(shuffle(visible().filter(q => wrongAll.has(q.n))));
$('unhide').onclick = () => { if (confirm(`Hiện lại ${hidden.size} câu đã ẩn?`)) { hidden.clear(); store.set('ktmt_hidden', hidden); refreshHome(); } };
$('hideQ').onchange = e => { const n = list[i].q.n; e.target.checked ? hidden.add(n) : hidden.delete(n); store.set('ktmt_hidden', hidden); };
$('next').onclick = next;
$('quit').onclick = finish;
$('again').onclick = () => { show('home'); refreshHome(); };
$('retryWrong').onclick = () => start(shuffle(wrongNow.map(w => w.q)));
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  const k = '1234'.indexOf(e.key) + 1 || 'abcd'.indexOf(e.key.toLowerCase()) + 1;
  if (k && !answered) { $('opts').children[k - 1]?.click(); }
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});
refreshHome();
</script>
</body>
</html>
