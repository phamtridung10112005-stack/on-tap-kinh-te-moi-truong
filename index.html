<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Kinh tế Môi trường</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2228;--muted:#66707a;--line:#dde1e6;--accent:#2563eb;--ok:#15803d;--okbg:#e7f6ec;--bad:#b91c1c;--badbg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1c1f24;--text:#e8eaed;--muted:#9aa3ad;--line:#2f343b;--accent:#5b8cff;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{flex:1 1 140px}
label{display:flex;align-items:center;gap:8px;margin:8px 0}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .2s}
.q{font-weight:600;font-size:1.05rem;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt b{margin-right:6px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.score{font-size:2rem;font-weight:700}
.wrong{border-top:1px solid var(--line);padding:10px 0}
.wrong .a{color:var(--ok)}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Ôn tập Kinh tế Môi trường</h1>
<div class="muted" id="total"></div>

<section id="home" class="card">
  <label>Số câu
    <select id="count"><option value="20">20 câu</option><option value="50">50 câu</option><option value="100">100 câu</option><option value="all">Tất cả</option></select>
  </label>
  <label>Thứ tự
    <select id="order"><option value="rand">Ngẫu nhiên</option><option value="seq">Theo thứ tự trong đề</option></select>
  </label>
  <label><input type="checkbox" id="shuf" checked> Đảo vị trí đáp án</label>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="start">Bắt đầu</button>
    <button id="redo">Ôn lại câu đã sai (<span id="nwrong">0</span>)</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="top"><span class="muted" id="pos"></span><span class="muted" id="live"></span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="card">
    <div class="muted" id="qnum"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </div>
  <div class="row">
    <button id="quit">Kết thúc</button>
    <button class="primary" id="next" disabled>Câu tiếp →</button>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <div class="score" id="score"></div>
    <div class="muted" id="scoreTxt"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="again">Làm bài mới</button>
      <button id="retryWrong">Làm lại các câu sai</button>
    </div>
  </div>
  <div class="card" id="review"></div>
</section>
</main>
<script>
const DATA = [{"n": 1, "q": "Kinh tế học là môn khoa học xã hội nghiên cứu cách thức:", "o": ["Phân bổ nguồn lực khan hiếm có hiệu quả.", "Lẩn tránh các vấn đề khan hiếm.", "Tạo ra vận may cho các cá nhân trên thị trường chứng khoán.", "Quản lý doanh nghiệp sao cho có lãi."], "a": [0]}, {"n": 2, "q": "Kinh tế học vi mô nghiên cứu:", "o": ["Các hoạt động diễn ra trong toàn bộ nền kinh tế.", "Hành vi ứng xử của các tế bào kinh tế.", "Mức giá chung của các hàng hoá, dịch vụ.", "Tỷ lệ thất nghiệp."], "a": [1]}, {"n": 3, "q": "Kinh tế học nghiên cứu làm thế nào để:", "o": ["Các nguồn lực khan hiếm được sử dụng để thỏa mãn những nhu cầu vô hạn", "Chúng ta lựa chọn được việc sử dụng các nguồn lực vô hạn", "Các nguồn lực vô hạn được sử dụng để thỏa mãn những nhu cầu có hạn", "Một xã hội không phải lựa chọn"], "a": [0]}, {"n": 4, "q": "Ba vấn đề kinh tế cơ bản của kinh tế học là :", "o": ["Sản xuất cái gì? Bằng nguyên liệu nào và bán giá bao nhiêu", "Sản xuất số lượng bao nhiêu? Bán giá như thế nào và phân phối ra sao", "Sản xuất cái gì? Sản xuất như thế nào? Sản xuất cho ai", "Sản xuất như thế nào? Số lượng và bán giá bao nhiêu"], "a": [2]}, {"n": 5, "q": "Chọn đáp án để điền vào phần còn trống: “…...............cho biết giá hàng hóa giảm thì lượng cầu tăng khi các yếu tố khác không thay đổi”.", "o": ["Luật cung", "Lợi ích cận biên", "Luật cầu", "Doanh thu cận biên"], "a": [2]}, {"n": 6, "q": "Chọn đáp án để điền vào phần còn trống: “…...............cho biết giá hàng hóa tăng thì lượng cung tăng khi các yếu tố khác không thay đổi.", "o": ["Luật cung", "Luật cầu", "Lợi ích cận biên", "Doanh thu cận biên"], "a": [0]}, {"n": 7, "q": "Khi giá cả của hàng hóa tăng lên sẽ dẫn đến lượng cầu giảm vì:", "o": ["Người cung sẽ cung số lượng nhỏ hơn.", "Chất lượng hàng hóa không đảm bảo", "Một số cá nhân mua hàng hoá này ít đi.", "Người bán không bán hàng nữa"], "a": [2]}, {"n": 8, "q": "Yếu tố nào sau đây sẽ làm dịch chuyển đường cầu hàng hóa máy tính:", "o": ["Thu nhập của người tiêu dùng.", "Giá cả của hàng hóa máy tính.", "Số lượng nhà sản xuất máy tính thay đổi.", "Giá cả của các yếu tố đầu vào"], "a": [0]}, {"n": 9, "q": "Yếu tố nào sau đây sẽ làm cho đường cầu về thực phẩm đông lạnh dịch chuyển?", "o": ["Số lượng người tiêu dùng giảm đi do có thông tin cho rằng thực phẩm đông lạnh có chứa nhiều chất gây ung thư", "Có nhiều nhà sản xuất cung cấp thực phẩm đông lạnh hơn.", "Lạm phát", "Giá của thực phẩm đông lạnh giảm."], "a": [0]}, {"n": 10, "q": "Yếu tố nào sau đây không phải là yếu tố ảnh hưởng đến cầu hàng hoá, dịch vụ:", "o": ["Thị hiếu, sở thích của người tiêu dùng.", "Các yếu tố đầu vào sản xuất.", "Giá cả hàng hoá liên quan.", "Thu nhập của người tiêu dùng."], "a": [1]}, {"n": 11, "q": "Cho biết hàm cung và hàm cầu về sản phẩm X có dạng: (D): P = 25 -  Q;  (S): P = 2 + Q. Nếu chính phủ đặt giá P = 15, trên thị trường sẽ có tình trạng:", "o": ["Thiếu hụt", "Dư thừa.", "Cân bằng", "Đầy đủ"], "a": [1]}, {"n": 12, "q": "Cung hàng hoá A tăng khi:", "o": ["Thị hiếu người tiêu dùng giảm", "Cầu hàng hoá thay đổi", "Thu nhập của người tiêu dùng tăng", "Công nghệ sản xuất hàng hoá A thay đổi hiện đại hơn."], "a": [3]}, {"n": 13, "q": "Cho hàm cung, hàm cầu của một hàng hoá A lần lượt như sau: QD = -4P + 28, QS = 6P -4. Giá và lượng cân bằng trên thị trường là bao nhiêu?", "o": ["PE =32; QE =14,4", "PE =15; QE =10", "PE =3,2; QE =15,2", "PE =32; QE =15"], "a": [2]}, {"n": 14, "q": "Nếu cam và táo (hàng hóa thay thế) cùng bán trên một thị trường, điều gì xảy ra khi giá cam tăng lên:", "o": ["Cầu với cam giảm xuống", "Cầu với táo tăng lên", "Cầu với táo giảm xuống", "Giá táo giảm xuống"], "a": [1]}, {"n": 15, "q": "Lượng cầu giảm có nghĩa là:", "o": ["Dịch chuyển đường cầu sang phải", "Đường cầu không đổi", "Vận động về phía trên (bên trái) đường cầu", "Vận động về phía dưới (bên phải) đường cầu."], "a": [2]}, {"n": 16, "q": "Khi giá thịt bò tăng sẽ gây ra:", "o": ["Tăng cầu về thịt gà (hàng hoá thay thế).", "Tăng cầu khoai tây rán (hàng hoá bổ sung).", "Tăng lượng cầu về thịt bò.", "Giảm lượng cung về thịt bò."], "a": [0]}, {"n": 17, "q": "Điều nào sau đây không đúng với thị trường cạnh tranh hoàn hảo?", "o": ["Có nhiều hãng bán hàng", "Chỉ có một sỗ hãng bán hàng", "Các hãng bán hàng đưa ra thị trường các sản phẩm đồng nhất.", "Từng hãng bán hàng riêng lẻ không kiểm soát được giá thị trường"], "a": [1]}, {"n": 18, "q": "Hãy cho biết những vấn đề nào nghiên cứu hoạt động của nền kinh tế với tư cách một tổng thể là:", "o": ["Những vấn đề cơ bản về kinh tế vi mô", "Những vấn đề cơ bản về kinh tế vĩ mô", "Những vấn đề cơ bản về kinh tế tuần hoàn", "Những vấn đề cơ bản về kinh tế xanh"], "a": [1]}, {"n": 19, "q": "Thành phần lớn nhất trong GDP của Việt Nam là:", "o": ["Tiêu dùng", "Đầu tư", "Chi tiêu của chính phủ", "Xuất khẩu ròng"], "a": [0]}, {"n": 20, "q": "Tổng sản phẩm quốc dân (GNP) là:", "o": ["GNP là chỉ tiêu phản ánh giá trị bằng tiền của toàn bộ sản phẩm cuối cùng do công dân một nước sản xuất ra trong một thời gian nhất định thường là một năm.", "GNP là một chỉ tiêu đo lường tổng giá trị thị trường của tất cả các hàng hoá và dịch vụ cuối cùng được sản xuất ra trong phạm vi lãnh thổ quốc gia, trong một thời kỳ nhất định(thường là một năm).", "GNP là chỉ tiêu phản ánh giá trị bằng tiền của toàn bộ sản phẩm trung gian do công dân một nước sản xuất ra trong một thời gian nhất định thường là một năm.", "GNP là chỉ tiêu phản ánh giá trị bằng tiền của toàn bộ sản phẩm trung gian và sản phẩm cuối cùng do công dân một nước sản xuất ra trong một thời gian nhất định thường là một năm."], "a": [0]}, {"n": 21, "q": "Trong nền kinh tế có giao thương với nước ngoài. Tổng sản phẩm quốc dân được tính theo công thức nào sau đây?", "o": ["GNP=C+I+G+NPI", "GDP=C+I+G+NX", "GNP=C+I+G+NX+NPI", "GDP=C+I+G"], "a": [2]}, {"n": 22, "q": "Trong nền kinh tế mở có giao thương với nước ngoài. Tổng sản phẩm quốc nội được tính theo công thức nào sau đây?", "o": ["GDP=C+I+G+NX", "GDP=C+I+G", "GNP=C+I+G+NX+NPI", "GNP=GDP+NPI"], "a": [0]}, {"n": 23, "q": "Câu nào bình luận về GDP sau đây là sai?", "o": ["GDP có thể được tính bằng cách sử dụng giá cả hiện hành hoặc giá cả năm gốc.", "Cả hàng hoá trung gian và hàng hoá cuối cùng đều được tính vào GDP.", "Chỉ tính những hàng hóa và dịch vụ được sản xuất ra trong thời kỳ nghiên cứu thường là một năm", "GDP không tính các hàng hóa trung gian và dịch vụ nhập khẩu."], "a": [1]}, {"n": 24, "q": "Thu nhập ròng từ tài sản nước ngoài NPI là:", "o": ["Là chênh lệch giữa thu nhập của công dân nước sở tại ở nước ngoài và công dân nước ngoài ở nước sở tại", "Là chênh lệch giữa thu nhập của công dân làm việc trong nước với công dân đi xuất khẩu lao động", "Là chênh lệch giữa thu nhập của công dân nước ngoài ở trong nước và công dân nước ngoài đi xuất khẩu lao động", "Là chênh lệch giữa thu nhập của công nhân nước sở tại với công dân nước sở tại ở nước ngoài"], "a": [0]}, {"n": 25, "q": "GDP danh nghĩa:", "o": ["Được tính theo giá của năm gốc", "Được tính theo giá cố định", "Được sử dụng để phản ánh sự thay đổi của phúc lợi kinh tế theo thời gian.", "Được tính theo giá hiện hành."], "a": [3]}, {"n": 26, "q": "Công thức tính chỉ tiêu nào phản ánh sai về mối quan hệ giữa các chỉ tiêu kinh tế vĩ mô?", "o": ["Sản phẩm quốc dân ròng: NNP=GNP-Khấu hao", "Thu nhập quốc dân: Y=NNP-Te(thuế gián thu)", "Thu nhập khả dụng: Yđ=Y-Thuế trực thu(Tđ)+ Trợ cấp (Tr)", "Yđ=Tiêu dùng(C)+Tiết kiệm(S)+ Đầu tư (I)"], "a": [3]}, {"n": 27, "q": "Điền cụm từ thích hợp vào chỗ trống (….) trong khái niệm sau đây: “……… là tình trạng người lao động mong muốn có việc làm nhưng chưa tìm được việc làm”.", "o": ["Thất nghiệp", "Bỏ việc", "Sa thải", "Giải nghệ"], "a": [0]}, {"n": 28, "q": "Tác hại của thất nghiệp là:", "o": ["Thất nghiệp tác động đến tăng trưởng kinh tế và lạm phát.", "Thất nghiệp ảnh hưởng đến thu nhập và đời sống người lao động.", "Thất nghiệp ảnh hưởng đến trật tự xã hội, an toàn xã hội. Tỷ lệ thất nghiệp càng cao, thì cái giá phải trả càng đắt.", "Tất cả các ý còn lại đều đúng"], "a": [3]}, {"n": 29, "q": "Tình trạng thất nghiệp xuất hiện do tính chu kì của nền kinh tế khi nền kinh tế bị suy thoái hoặc khủng hoảng dẫn đến mức cầu chung về lao động giảm được gọi là:", "o": ["Thất nghiệp tạm thời", "Thất nghiệp cơ cấu", "Thất nghiệp chu kì", "Thất nghiệp tự nguyện"], "a": [2]}, {"n": 30, "q": "Tình trạng mức giá chung bình của nền kinh tế tăng lên trong một khoảng thời gian nhất định được gọi là:", "o": ["Tăng trưởng", "Lạm phát", "Khủng hoảng", "Thiểu phát"], "a": [1]}, {"n": 31, "q": "Căn cứ vào tỉ lệ lạm phát, mức độ tăng của chỉ số giá cả ở một con số hằng năm (0% < CPI < 10%) được gọi là tình trạng:", "o": ["Lạm phát vừa phải", "Lạm phát phi mã", "Siêu lạm phát", "Lạm phát nghiêm trọng"], "a": [0]}, {"n": 32, "q": "Xác định nguyên nhân dẫn đến lạm phát trong thông tin sau:", "o": ["Chi phí sản xuất tăng cao", "Tổng cầu của nền kinh tế tăng.", "Giá cả nguyên liệu, nhân công, thuế,… giảm.", "Lượng tiền trong lưu thông vượt quá mức cần thiết."], "a": [0, 1, 3]}, {"n": 33, "q": "Biến đổi khí hậu có thể làm tăng nguy cơ phát sinh dịch bệnh vì:", "o": ["Tăng độ ẩm và nhiệt độ của môi trường", "Khí hậu ổn định hơn", "Tầng ozon được phục hồi", "Giảm sự trao đổi khí CO₂ trong khí quyển"], "a": [0]}, {"n": 34, "q": "Môi trường nhân tạo bao gồm:", "o": ["Tài nguyên thiên nhiên", "Các quan hệ xã hội", "Các công trình do con người tạo ra", "Khí quyển"], "a": [2]}, {"n": 35, "q": "Nước mặn trên trái đất chiếm tỷ lệ bao nhiêu?", "o": ["97%", "2%", "1%", "5%"], "a": [0]}, {"n": 36, "q": "Tầng khí quyển nào chứa hầu hết các hiện tượng thời tiết?", "o": ["Tầng bình lưu", "Tầng trung quyển", "Tầng đối lưu", "Tầng nhiệt quyển"], "a": [2]}, {"n": 37, "q": "Thành phần chính của không khí là:", "o": ["O2 và CO2", "O2 và H2", "N2 và O2", "CO2 và CH4"], "a": [2]}, {"n": 38, "q": "Sinh quyển bao gồm:", "o": ["Toàn bộ khí quyển", "Toàn bộ thủy quyển", "Tầng đối lưu", "Tất cả các sinh vật sống và hệ sinh thái trên Trái đất"], "a": [3]}, {"n": 39, "q": "Môi trườ a phương", "Là mô hình dành riêng cho các quốc gia phát triển"], "a": [2]}, {"n": 62, "q": "Ba trụ cột của phát triển bền vững thường có mối quan hệ như thế nào trong thực tế?", "o": ["Luôn bổ trợ lẫn nhau một cách hài hòa, thường ít xung đột nên không cần có biện pháp quản lý hợp lý", "Luôn mâu thuẫn với nhau và không thể điều hòa, xung đột với nhau nên rất khó quản lý", "Luôn có mối quan hệ tác động qua lại với nhau, có thể xung đột nếu không được quản lý hợp lý", "Không liên quan trực tiếp đến nhau, các yếu tố hoạt động độc lập không cần có biện pháp quản lý"], "a": [2]}, {"n": 63, "q": "Điểm nổi bật trong định nghĩa của “Brundtland Report” (1987) về phát triển bền vững là gì?", "o": ["Nhấn mạnh vai trò của tăng trưởng GDP", "Tập trung vào quyền lợi của các quốc gia nghèo", "Nhấn mạnh trách nhiệm liên thế hệ trong phát triển", "Ưu tiên cải thiện chất lượng hạ tầng kỹ thuật"], "a": [2]}, {"n": 64, "q": "Câu nào sau đây thuộc về kinh tế vi mô:", "o": ["Các hoạt động diễn ra trong toàn bộ nền kinh tế.", "Hành vi ứng xử của các tế bào kinh tế.", "Mức giá chung của các hàng hoá, dịch vụ.", "Tỷ lệ thất nghiệp."], "a": [1]}, {"n": 65, "q": "Kinh tế học vi mô tiếp cận với những nghiên cứu kinh tế dưới góc độ", "o": ["Toàn bộ nền kinh tế", "Chính phủ", "Sự hoạt động của các thị trường riêng lẻ", "Hoạt động của hệ thống ngân hàng"], "a": [2]}, {"n": 66, "q": "Khan hiếm là vấn đề:", "o": ["Hiệu quả sản xuất không còn nữa", "Không tồn tại trong các nền kinh tế giàu có", "Số lượng các nguồn lực xác định còn nhu cầu con người là vô hạn", "Nảy sinh khi năng suất tăng chậm lại"], "a": [2]}, {"n": 67, "q": "Các nguồn lực kinh tế là khan hiếm cho nên:", "o": ["Phải lựa chọn mục tiêu khi sản xuất", "Chính phủ phải điều tiết nền kinh tế", "Phải mở cửa nền kinh tế", "Sự chênh lệch giàu – nghèo là không tránh khỏi"], "a": [0]}, {"n": 68, "q": "Đường giới hạn khả năng sản xuất mô tả:", "o": ["Sự kết hợp hàng hóa, dịch vụ được sản xuất khi giá thay đổi", "Khối lượng tối đa của nguồn lực ": [1]}, {"n": 136, "q": "Phương pháp thiêu đốt thường không hiệu quả cho loại chất thải nào dưới đây?", "o": ["Chất thải hữu cơ", "Chất thải dung môi, chất thải không phân hủy sinh học", "Chất thải rắn bị nhiễm khuẩn bởi các vi sinh vật gây bệnh truyền nhiễm, nguy hiểm", "Chất thải y tế"], "a": [0]}, {"n": 137, "q": "Hãy lựa chọn đáp án đúng nhất: ưu điểm của phương pháp thiêu đốt chất thải rắn:", "o": ["Khả năng tận dụng được nhiệt, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, xử lý triệt để thành phần ô nhiễm.", "Vận hành đòi hỏi rác có nhiệt trị cao, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, xử lý triệt để thành phần ô nhiễm.", "Khả năng tận dụng được nhiệt, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, có thể gặp khó khăn khi có sự thay đổi về thành phần chất thải.", "Khả năng tận dụng được nhiệt, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, xử lý triệt để thành phần ô nhiễm, chi phí đầu tư và bảo trì thấp so với các phương pháp khác"], "a": [0]}, {"n": 138, "q": "Trong sinh thái công nghiệp (STCN), chất thải của một doanh nghiệp có thể trở thành:", "o": ["Sản phẩm phụ bỏ đi", "Chứng từ môi trường", "Nguyên liệu đầu vào của doanh nghiệp khác", "Chứng cứ xử phạt hành chính"], "a": [2]}, {"n": 139, "q": "Nhãn sinh thái tác động đến hành vi nào trong chuỗi sản xuất – tiêu dùng?", "o": ["Hành vi đầu tư của ngân hàng", "Quyết định lựa chọn nguyên vật liệu của nhà cung cấp", "Hành vi tiêu dùng của người dân và định hướng sản xuất của doanh nghiệp", "Lựa chọn phương pháp xử lý nước thải của chính quyền địa phương"], "a": [2]}, {"n": 140, "q": "Một trong những rào cản lớn nhất của Sinh thái công nghiệp (STCN) là:", "o": ["Thiếu ngân sách đầu tư công nghệ cao và các điều kiện để xây dựng khu STCN", "Mối quan hệ phụ thuộc giữa các doanh nghiệp khiến rủi ro tăng cao", "Không có chính sách pháp luật về bảo vệ môi trường khuyến khích việc xây dựng khu STCN", "Thiếu nguồn nhân lực chất lượng cao và kinh nghiệm trong việc xây dựng khu STCN"], "a": [0]}, {"n": 141, "q": "Tại sao không thể sử dụng một chỉ số duy nhất để đánh giá tính bền vững của một lĩnh vực?", "o": ["Vì chỉ số duy nhất không đủ độ tin cậy, cần có nhiều chỉ số mới đánh giá đầy đủ được", "Vì sự phát triển bền vững là một khái niệm không định lượng, cần có nhiều chỉ số mới đánh giá đầy đủ được", "Vì tính bền vững cần được đánh giá tổng hợp từ nhiều khía cạnh định lượng và định tính", "Vì tính bền vững cần được đánh giá từ một số khía cạnh định lượng và định tính"], "a": [2]}, {"n": 142, "q": "So sánh hai quốc gia có cùng GDP nhưng quốc gia A có cơ cấu GDP nghiêng về dịch vụ và công nghiệp, còn quốc gia B nghiêng về nông nghiệp. Quốc gia nào có khả năng tăng trưởng bền vững hơn về kinh tế và vì sao?", "o": ["Quốc gia A, vì dịch vụ và công nghiệp có khả năng sinh lợi cao hơn", "Quốc gia B, vì nông nghiệp ổn định hơn, đảm bảo an ninh lượng thực giúp đảm bảo ổn định của xã hội", "Cả hai như nhau vì có cùng GDP", "Quốc gia B, vì phù hợp với nước đang phát triển"], "a": [0]}, {"n": 143, "q": "Nếu một quốc gia duy trì tốc độ tăng trưởng GDP cao nhưng cơ cấu GDP phụ thuộc vào khai thác tài nguyên không tái tạo, đánh giá nào sau đây là chính xác nhất?", "o": ["Quốc gia này phát triển không toàn diện chưa đạt phát triển bền vững", "Quốc gia đạt bền vững kinh tế nhưng chưa đạt bền vững về môi trường", "Quốc gia này có rủi ro thiếu bền vững về kinh tế trong dài hạn", "Quốc gia đạt bền vững về môi trường nhưng chưa đạt bền vững về kinh tế"], "a": [2]}, {"n": 144, "q": "Chỉ số HDI là tổng hợp của các yếu tố nào sau đây?", "o": ["Tuổi thọ, học vấn, thu nhập bình quân theo đô la Mỹ", "Tuổi thọ, trình độ học vấn, PPP/người", "GDP, GNP, PPP/người", "Y tế, giáo dục, công nghệ"], "a": [1]}, {"n": 145, "q": "Điểm tương đồng giữa chỉ số Gini và chỉ số HDI trong việc đánh giá t const $ = id => document.getElementById(id);
const L = 'ABCD';
const store = {
  get(){ try { return new Set(JSON.parse(localStorage.getItem('ktmt_wrong') || '[]')); } catch { return new Set(); } },
  set(s){ try { localStorage.setItem('ktmt_wrong', JSON.stringify([...s])); } catch {} }
};
let wrongAll = store.get(), list = [], i = 0, correct = 0, wrongNow = [], answered = false;

function shuffle(a){ a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function show(id){ for (const s of ['home','quiz','result']) $(s).classList.toggle('hidden', s !== id); window.scrollTo(0, 0); }
function refreshHome(){ $('nwrong').textContent = wrongAll.size; $('redo').disabled = !wrongAll.size; $('total').textContent = DATA.length + ' câu hỏi trắc nghiệm'; }

function start(qs){
  const shuf = $('shuf').checked;
  list = qs.map(q => ({ q, order: shuf ? shuffle([0,1,2,3]) : [0,1,2,3] }));
  i = 0; correct = 0; wrongNow = [];
  show('quiz'); render();
}
function render(){
  const { q, order } = list[i];
  answered = false;
  $('pos').textContent = `Câu ${i + 1}/${list.length}`;
  $('live').textContent = `Đúng ${correct}/${i}`;
  $('prog').style.width = (i / list.length * 100) + '%';
  $('qnum').textContent = `Câu ${q.n} trong đề`;
  $('qtext').textContent = q.q;
  $('opts').innerHTML = '';
  order.forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<b>${L[k]}.</b>`;
    b.append(q.o[oi]);
    b.onclick = () => pick(oi);
    b.dataset.oi = oi;
    $('opts').append(b);
  });
  $('next').disabled = true;
  $('next').textContent = i + 1 < list.length ? 'Câu tiếp →' : 'Xem kết quả';
}
function pick(oi){
  if (answered) return;
  answered = true;
  const q = list[i].q, ok = q.a.includes(oi);
  for (const b of $('opts').children) {
    const v = +b.dataset.oi;
    if (q.a.includes(v)) b.classList.add('ok');
    else if (v === oi) b.classList.add('bad');
    b.disabled = !q.a.includes(v) && v !== oi;
  }
  if (ok) { correct++; wrongAll.delete(q.n); }
  else { wrongNow.push({ q, oi }); wrongAll.add(q.n); }
  store.set(wrongAll);
  $('live').textContent = `Đúng ${correct}/${i + 1}`;
  $('next').disabled = false;
  $('next').focus();
}
function next(){ if (!answered) return; if (++i < list.length) render(); else finish(); }
function finish(){
  const done = answered ? i + (i < list.length ? 1 : 0) : i;
  const n = Math.min(done, list.length);
  $('score').textContent = `${correct}/${n}`;
  $('scoreTxt').textContent = n ? `Đúng ${Math.round(correct / n * 100)}%` : 'Chưa làm câu nào';
  $('retryWrong').disabled = !wrongNow.length;
  const r = $('review');
  r.innerHTML = wrongNow.length ? '<b>Các câu làm sai</b>' : '<b>Không sai câu nào 🎉</b>';
  for (const { q, oi } of wrongNow) {
    const d = document.createElement('div'); d.className = 'wrong';
    const t = document.createElement('div'); t.textContent = `Câu ${q.n}: ${q.q}`; t.style.fontWeight = 600;
    const y = document.createElement('div'); y.className = 'muted'; y.textContent = 'Bạn chọn: ' + q.o[oi];
    const a = document.createElement('div'); a.className = 'a'; a.textContent = 'Đáp án: ' + q.a.map(k => q.o[k]).join(' / ');
    d.append(t, y, a); r.append(d);
  }
  show('result'); refreshHome();
}

$('start').onclick = () => {
  let qs = $('order').value === 'rand' ? shuffle(DATA) : DATA.slice();
  const c = $('count').value; if (c !== 'all') qs = qs.slice(0, +c);
  start(qs);
};
$('redo').onclick = () => start(shuffle(DATA.filter(q => wrongAll.has(q.n))));
$('next').onclick = next;
$('quit').onclick = finish;
$('again').onclick = () => { show('home'); refreshHome(); };
$('retryWrong').onclick = () => start(shuffle(wrongNow.map(w => w.q)));
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  const k = '1234'.indexOf(e.key) + 1 || 'abcd'.indexOf(e.key.toLowerCase()) + 1;
  if (k && !answered) { $('opts').children[k - 1]?.click(); }
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});
refreshHome();
</script>
</body>
</html>
