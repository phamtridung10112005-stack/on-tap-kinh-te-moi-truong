<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Kinh tế Môi trường</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2228;--muted:#66707a;--line:#dde1e6;--accent:#2563eb;--ok:#15803d;--okbg:#e7f6ec;--bad:#b91c1c;--badbg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1c1f24;--text:#e8eaed;--muted:#9aa3ad;--line:#2f343b;--accent:#5b8cff;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{flex:1 1 140px}
label{display:flex;align-items:center;gap:8px;margin:8px 0}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .2s}
.q{font-weight:600;font-size:1.05rem;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt b{margin-right:6px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.score{font-size:2rem;font-weight:700}
.wrong{border-top:1px solid var(--line);padding:10px 0}
.wrong .a{color:var(--ok)}
.explain{margin-top:12px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--bg);border-radius:8px}
.explain b{display:block;margin-bottom:4px}
.hide{margin:12px 0 0;color:var(--muted);font-size:.95rem}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Ôn tập Kinh tế Môi trường</h1>
<div class="muted" id="total"></div>

<section id="home" class="card">
  <label>Số câu
    <select id="count"><option value="20">20 câu</option><option value="50">50 câu</option><option value="100">100 câu</option><option value="all">Tất cả</option></select>
  </label>
  <label>Thứ tự
    <select id="order"><option value="rand">Ngẫu nhiên</option><option value="seq">Theo thứ tự trong đề</option></select>
  </label>
  <label><input type="checkbox" id="shuf" checked> Đảo vị trí đáp án</label>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="start">Bắt đầu</button>
    <button id="redo">Ôn lại câu đã sai (<span id="nwrong">0</span>)</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="unhide">Hiện lại câu đã ẩn (<span id="nhidden">0</span>)</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="top"><span class="muted" id="pos"></span><span class="muted" id="live"></span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="card">
    <div class="muted" id="qnum"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div id="exp" class="explain hidden"><b>Giải thích</b><span id="expText"></span></div>
    <label class="hide"><input type="checkbox" id="hideQ"> Đã thuộc, không hỏi lại câu này</label>
  </div>
  <div class="row">
    <button id="quit">Kết thúc</button>
    <button class="primary" id="next" disabled>Câu tiếp →</button>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <div class="score" id="score"></div>
    <div class="muted" id="scoreTxt"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="again">Làm bài mới</button>
      <button id="retryWrong">Làm lại các câu sai</button>
    </div>
  </div>
  <div class="card" id="review"></div>
</section>
</main>
<script>
const DATA = [{"n": 1, "q": "Kinh tế học là môn khoa học xã hội nghiên cứu cách thức:", "o": ["Phân bổ nguồn lực khan hiếm có hiệu quả.", "Lẩn tránh các vấn đề khan hiếm.", "Tạo ra vận may cho các cá nhân trên thị trường chứng khoán.", "Quản lý doanh nghiệp sao cho có lãi."], "a": [0], "e": "Kinh tế học nghiên cứu cách xã hội phân bổ nguồn lực khan hiếm sao cho hiệu quả nhất. Các phương án khác chỉ là mục tiêu riêng của cá nhân/doanh nghiệp."}, {"n": 2, "q": "Kinh tế học vi mô nghiên cứu:", "o": ["Các hoạt động diễn ra trong toàn bộ nền kinh tế.", "Hành vi ứng xử của các tế bào kinh tế.", "Mức giá chung của các hàng hoá, dịch vụ.", "Tỷ lệ thất nghiệp."], "a": [1], "e": "Vi mô nghiên cứu từng 'tế bào' của nền kinh tế: hộ gia đình, doanh nghiệp, thị trường riêng lẻ. Mức giá chung, thất nghiệp, toàn bộ nền kinh tế là vĩ mô."}, {"n": 3, "q": "Kinh tế học nghiên cứu làm thế nào để:", "o": ["Các nguồn lực khan hiếm được sử dụng để thỏa mãn những nhu cầu vô hạn", "Chúng ta lựa chọn được việc sử dụng các nguồn lực vô hạn", "Các nguồn lực vô hạn được sử dụng để thỏa mãn những nhu cầu có hạn", "Một xã hội không phải lựa chọn"], "a": [0], "e": "Bản chất kinh tế học: nguồn lực có hạn (khan hiếm) nhưng nhu cầu con người vô hạn → phải lựa chọn cách sử dụng."}, {"n": 4, "q": "Ba vấn đề kinh tế cơ bản của kinh tế học là :", "o": ["Sản xuất cái gì? Bằng nguyên liệu nào và bán giá bao nhiêu", "Sản xuất số lượng bao nhiêu? Bán giá như thế nào và phân phối ra sao", "Sản xuất cái gì? Sản xuất như thế nào? Sản xuất cho ai", "Sản xuất như thế nào? Số lượng và bán giá bao nhiêu"], "a": [2], "e": "Ba câu hỏi kinh tế cơ bản: Sản xuất cái gì? Sản xuất như thế nào? Sản xuất cho ai?"}, {"n": 5, "q": "Chọn đáp án để điền vào phần còn trống: “…...............cho biết giá hàng hóa giảm thì lượng cầu tăng khi các yếu tố khác không thay đổi”.", "o": ["Luật cung", "Lợi ích cận biên", "Luật cầu", "Doanh thu cận biên"], "a": [2], "e": "Luật cầu: giá giảm → lượng cầu tăng (và ngược lại), các yếu tố khác không đổi."}, {"n": 6, "q": "Chọn đáp án để điền vào phần còn trống: “…...............cho biết giá hàng hóa tăng thì lượng cung tăng khi các yếu tố khác không thay đổi.", "o": ["Luật cung", "Luật cầu", "Lợi ích cận biên", "Doanh thu cận biên"], "a": [0], "e": "Luật cung: giá tăng → lượng cung tăng, các yếu tố khác không đổi."}, {"n": 7, "q": "Khi giá cả của hàng hóa tăng lên sẽ dẫn đến lượng cầu giảm vì:", "o": ["Người cung sẽ cung số lượng nhỏ hơn.", "Chất lượng hàng hóa không đảm bảo", "Một số cá nhân mua hàng hoá này ít đi.", "Người bán không bán hàng nữa"], "a": [2], "e": "Giá tăng thì người mua mua ít đi (hoặc chuyển sang hàng thay thế) nên lượng cầu giảm."}, {"n": 8, "q": "Yếu tố nào sau đây sẽ làm dịch chuyển đường cầu hàng hóa máy tính:", "o": ["Thu nhập của người tiêu dùng.", "Giá cả của hàng hóa máy tính.", "Số lượng nhà sản xuất máy tính thay đổi.", "Giá cả của các yếu tố đầu vào"], "a": [0], "e": "Đường cầu chỉ dịch chuyển khi yếu tố NGOÀI giá thay đổi (thu nhập, thị hiếu, giá hàng liên quan…). Giá của chính máy tính chỉ làm di chuyển dọc đường cầu; số nhà sản xuất, giá đầu vào ảnh hưởng đến cung."}, {"n": 9, "q": "Yếu tố nào sau đây sẽ làm cho đường cầu về thực phẩm đông lạnh dịch chuyển?", "o": ["Số lượng người tiêu dùng giảm đi do có thông tin cho rằng thực phẩm đông lạnh có chứa nhiều chất gây ung thư", "Có nhiều nhà sản xuất cung cấp thực phẩm đông lạnh hơn.", "Lạm phát", "Giá của thực phẩm đông lạnh giảm."], "a": [0], "e": "Thông tin gây ung thư làm thay đổi thị hiếu, số người mua → đường cầu dịch chuyển. Giá giảm chỉ là di chuyển dọc đường cầu; thêm nhà sản xuất là thay đổi cung."}, {"n": 10, "q": "Yếu tố nào sau đây không phải là yếu tố ảnh hưởng đến cầu hàng hoá, dịch vụ:", "o": ["Thị hiếu, sở thích của người tiêu dùng.", "Các yếu tố đầu vào sản xuất.", "Giá cả hàng hoá liên quan.", "Thu nhập của người tiêu dùng."], "a": [1], "e": "Yếu tố đầu vào sản xuất (nguyên liệu, công nghệ…) ảnh hưởng đến CUNG, không ảnh hưởng đến cầu."}, {"n": 11, "q": "Cho biết hàm cung và hàm cầu về sản phẩm X có dạng: (D): P = 25 -  Q;  (S): P = 2 + Q. Nếu chính phủ đặt giá P = 15, trên thị trường sẽ có tình trạng:", "o": ["Thiếu hụt", "Dư thừa.", "Cân bằng", "Đầy đủ"], "a": [1], "e": "Cân bằng: 25 – Q = 2 + Q → Q = 11,5; P = 13,5. Giá 15 > 13,5 → lượng cung (13) > lượng cầu (10) → dư thừa."}, {"n": 12, "q": "Cung hàng hoá A tăng khi:", "o": ["Thị hiếu người tiêu dùng giảm", "Cầu hàng hoá thay đổi", "Thu nhập của người tiêu dùng tăng", "Công nghệ sản xuất hàng hoá A thay đổi hiện đại hơn."], "a": [3], "e": "Công nghệ hiện đại hơn làm giảm chi phí → cung tăng. Thu nhập, thị hiếu là yếu tố của cầu."}, {"n": 13, "q": "Cho hàm cung, hàm cầu của một hàng hoá A lần lượt như sau: QD = -4P + 28, QS = 6P -4. Giá và lượng cân bằng trên thị trường là bao nhiêu?", "o": ["PE =32; QE =14,4", "PE =15; QE =10", "PE =3,2; QE =15,2", "PE =32; QE =15"], "a": [2], "e": "Cho QD = QS: –4P + 28 = 6P – 4 → 10P = 32 → P = 3,2; Q = 6×3,2 – 4 = 15,2."}, {"n": 14, "q": "Nếu cam và táo (hàng hóa thay thế) cùng bán trên một thị trường, điều gì xảy ra khi giá cam tăng lên:", "o": ["Cầu với cam giảm xuống", "Cầu với táo tăng lên", "Cầu với táo giảm xuống", "Giá táo giảm xuống"], "a": [1], "e": "Cam và táo thay thế nhau: giá cam tăng → người mua chuyển sang táo → cầu với táo tăng."}, {"n": 15, "q": "Lượng cầu giảm có nghĩa là:", "o": ["Dịch chuyển đường cầu sang phải", "Đường cầu không đổi", "Vận động về phía trên (bên trái) đường cầu", "Vận động về phía dưới (bên phải) đường cầu."], "a": [2], "e": "'Lượng cầu' thay đổi do giá của chính hàng đó → di chuyển DỌC đường cầu. Lượng cầu giảm (giá tăng) → di chuyển lên trên, sang trái."}, {"n": 16, "q": "Khi giá thịt bò tăng sẽ gây ra:", "o": ["Tăng cầu về thịt gà (hàng hoá thay thế).", "Tăng cầu khoai tây rán (hàng hoá bổ sung).", "Tăng lượng cầu về thịt bò.", "Giảm lượng cung về thịt bò."], "a": [0], "e": "Thịt gà thay thế thịt bò: giá bò tăng → người mua chuyển sang gà → cầu thịt gà tăng."}, {"n": 17, "q": "Điều nào sau đây không đúng với thị trường cạnh tranh hoàn hảo?", "o": ["Có nhiều hãng bán hàng", "Chỉ có một sỗ hãng bán hàng", "Các hãng bán hàng đưa ra thị trường các sản phẩm đồng nhất.", "Từng hãng bán hàng riêng lẻ không kiểm soát được giá thị trường"], "a": [1], "e": "Cạnh tranh hoàn hảo có RẤT NHIỀU hãng, sản phẩm đồng nhất, không hãng nào kiểm soát được giá. 'Chỉ có một số hãng' là đặc điểm của độc quyền nhóm."}, {"n": 18, "q": "Hãy cho biết những vấn đề nào nghiên cứu hoạt động của nền kinh tế với tư cách một tổng thể là:", "o": ["Những vấn đề cơ bản về kinh tế vi mô", "Những vấn đề cơ bản về kinh tế vĩ mô", "Những vấn đề cơ bản về kinh tế tuần hoàn", "Những vấn đề cơ bản về kinh tế xanh"], "a": [1], "e": "Kinh tế vĩ mô nghiên cứu nền kinh tế như một tổng thể (GDP, lạm phát, thất nghiệp…)."}, {"n": 19, "q": "Thành phần lớn nhất trong GDP của Việt Nam là:", "o": ["Tiêu dùng", "Đầu tư", "Chi tiêu của chính phủ", "Xuất khẩu ròng"], "a": [0], "e": "Ở Việt Nam, tiêu dùng của hộ gia đình (C) chiếm tỷ trọng lớn nhất trong GDP (khoảng 60–65%)."}, {"n": 20, "q": "Tổng sản phẩm quốc dân (GNP) là:", "o": ["GNP là chỉ tiêu phản ánh giá trị bằng tiền của toàn bộ sản phẩm cuối cùng do công dân một nước sản xuất ra trong một thời gian nhất định thường là một năm.", "GNP là một chỉ tiêu đo lường tổng giá trị thị trường của tất cả các hàng hoá và dịch vụ cuối cùng được sản xuất ra trong phạm vi lãnh thổ quốc gia, trong một thời kỳ nhất định(thường là một năm).", "GNP là chỉ tiêu phản ánh giá trị bằng tiền của toàn bộ sản phẩm trung gian do công dân một nước sản xuất ra trong một thời gian nhất định thường là một năm.", "GNP là chỉ tiêu phản ánh giá trị bằng tiền của toàn bộ sản phẩm trung gian và sản phẩm cuối cùng do công dân một nước sản xuất ra trong một thời gian nhất định thường là một năm."], "a": [0], "e": "GNP tính theo QUỐC TỊCH: giá trị sản phẩm CUỐI CÙNG do công dân một nước sản xuất (trong và ngoài nước). Phương án B là định nghĩa GDP (theo lãnh thổ)."}, {"n": 21, "q": "Trong nền kinh tế có giao thương với nước ngoài. Tổng sản phẩm quốc dân được tính theo công thức nào sau đây?", "o": ["GNP=C+I+G+NPI", "GDP=C+I+G+NX", "GNP=C+I+G+NX+NPI", "GDP=C+I+G"], "a": [2], "e": "GNP = GDP + NPI = C + I + G + NX + NPI."}, {"n": 22, "q": "Trong nền kinh tế mở có giao thương với nước ngoài. Tổng sản phẩm quốc nội được tính theo công thức nào sau đây?", "o": ["GDP=C+I+G+NX", "GDP=C+I+G", "GNP=C+I+G+NX+NPI", "GNP=GDP+NPI"], "a": [0], "e": "GDP theo chi tiêu trong nền kinh tế mở: GDP = C + I + G + NX."}, {"n": 23, "q": "Câu nào bình luận về GDP sau đây là sai?", "o": ["GDP có thể được tính bằng cách sử dụng giá cả hiện hành hoặc giá cả năm gốc.", "Cả hàng hoá trung gian và hàng hoá cuối cùng đều được tính vào GDP.", "Chỉ tính những hàng hóa và dịch vụ được sản xuất ra trong thời kỳ nghiên cứu thường là một năm", "GDP không tính các hàng hóa trung gian và dịch vụ nhập khẩu."], "a": [1], "e": "GDP chỉ tính hàng hóa CUỐI CÙNG; tính cả hàng trung gian sẽ bị tính trùng. Vì vậy B sai."}, {"n": 24, "q": "Thu nhập ròng từ tài sản nước ngoài NPI là:", "o": ["Là chênh lệch giữa thu nhập của công dân nước sở tại ở nước ngoài và công dân nước ngoài ở nước sở tại", "Là chênh lệch giữa thu nhập của công dân làm việc trong nước với công dân đi xuất khẩu lao động", "Là chênh lệch giữa thu nhập của công dân nước ngoài ở trong nước và công dân nước ngoài đi xuất khẩu lao động", "Là chênh lệch giữa thu nhập của công nhân nước sở tại với công dân nước sở tại ở nước ngoài"], "a": [0], "e": "NPI = thu nhập công dân nước mình kiếm ở nước ngoài – thu nhập người nước ngoài kiếm ở nước mình."}, {"n": 25, "q": "GDP danh nghĩa:", "o": ["Được tính theo giá của năm gốc", "Được tính theo giá cố định", "Được sử dụng để phản ánh sự thay đổi của phúc lợi kinh tế theo thời gian.", "Được tính theo giá hiện hành."], "a": [3], "e": "GDP danh nghĩa tính theo giá hiện hành; GDP thực tế mới tính theo giá năm gốc (giá cố định)."}, {"n": 26, "q": "Công thức tính chỉ tiêu nào phản ánh sai về mối quan hệ giữa các chỉ tiêu kinh tế vĩ mô?", "o": ["Sản phẩm quốc dân ròng: NNP=GNP-Khấu hao", "Thu nhập quốc dân: Y=NNP-Te(thuế gián thu)", "Thu nhập khả dụng: Yđ=Y-Thuế trực thu(Tđ)+ Trợ cấp (Tr)", "Yđ=Tiêu dùng(C)+Tiết kiệm(S)+ Đầu tư (I)"], "a": [3], "e": "Thu nhập khả dụng chỉ dùng để tiêu dùng và tiết kiệm: Yd = C + S. Thêm đầu tư I là sai."}, {"n": 27, "q": "Điền cụm từ thích hợp vào chỗ trống (….) trong khái niệm sau đây: “……… là tình trạng người lao động mong muốn có việc làm nhưng chưa tìm được việc làm”.", "o": ["Thất nghiệp", "Bỏ việc", "Sa thải", "Giải nghệ"], "a": [0], "e": "Thất nghiệp: người trong độ tuổi lao động, muốn làm việc nhưng chưa tìm được việc."}, {"n": 28, "q": "Tác hại của thất nghiệp là:", "o": ["Thất nghiệp tác động đến tăng trưởng kinh tế và lạm phát.", "Thất nghiệp ảnh hưởng đến thu nhập và đời sống người lao động.", "Thất nghiệp ảnh hưởng đến trật tự xã hội, an toàn xã hội. Tỷ lệ thất nghiệp càng cao, thì cái giá phải trả càng đắt.", "Tất cả các ý còn lại đều đúng"], "a": [3], "e": "Thất nghiệp vừa ảnh hưởng tăng trưởng – lạm phát, vừa giảm thu nhập người lao động, vừa gây bất ổn xã hội → tất cả đều đúng."}, {"n": 29, "q": "Tình trạng thất nghiệp xuất hiện do tính chu kì của nền kinh tế khi nền kinh tế bị suy thoái hoặc khủng hoảng dẫn đến mức cầu chung về lao động giảm được gọi là:", "o": ["Thất nghiệp tạm thời", "Thất nghiệp cơ cấu", "Thất nghiệp chu kì", "Thất nghiệp tự nguyện"], "a": [2], "e": "Thất nghiệp chu kỳ gắn với chu kỳ kinh doanh: suy thoái → tổng cầu lao động giảm → thất nghiệp tăng."}, {"n": 30, "q": "Tình trạng mức giá chung bình của nền kinh tế tăng lên trong một khoảng thời gian nhất định được gọi là:", "o": ["Tăng trưởng", "Lạm phát", "Khủng hoảng", "Thiểu phát"], "a": [1], "e": "Lạm phát là mức giá chung tăng liên tục trong một thời gian."}, {"n": 31, "q": "Căn cứ vào tỉ lệ lạm phát, mức độ tăng của chỉ số giá cả ở một con số hằng năm (0% < CPI < 10%) được gọi là tình trạng:", "o": ["Lạm phát vừa phải", "Lạm phát phi mã", "Siêu lạm phát", "Lạm phát nghiêm trọng"], "a": [0], "e": "Lạm phát một con số (dưới 10%/năm) là lạm phát vừa phải; 10% đến dưới 1000% là phi mã; trên 1000% là siêu lạm phát."}, {"n": 32, "q": "Xác định nguyên nhân dẫn đến lạm phát trong thông tin sau:", "o": ["Chi phí sản xuất tăng cao", "Tổng cầu của nền kinh tế tăng.", "Giá cả nguyên liệu, nhân công, thuế,… giảm.", "Lượng tiền trong lưu thông vượt quá mức cần thiết."], "a": [3], "e": "Đáp án D: lượng tiền lưu thông vượt quá mức cần thiết là nguyên nhân gốc của lạm phát (\"nhiều tiền đuổi theo ít hàng\"). A, B cũng có thể gây lạm phát nhưng mang tính tạm thời; C (chi phí giảm) thì không gây lạm phát."}, {"n": 33, "q": "Biến đổi khí hậu có thể làm tăng nguy cơ phát sinh dịch bệnh vì:", "o": ["Tăng độ ẩm và nhiệt độ của môi trường", "Khí hậu ổn định hơn", "Tầng ozon được phục hồi", "Giảm sự trao đổi khí CO₂ trong khí quyển"], "a": [0], "e": "Nhiệt độ và độ ẩm tăng tạo điều kiện cho vi khuẩn, muỗi… phát triển → dịch bệnh dễ bùng phát."}, {"n": 34, "q": "Môi trường nhân tạo bao gồm:", "o": ["Tài nguyên thiên nhiên", "Các quan hệ xã hội", "Các công trình do con người tạo ra", "Khí quyển"], "a": [2], "e": "Môi trường nhân tạo là những gì con người tạo ra: nhà cửa, đường sá, nhà máy, công trình…"}, {"n": 35, "q": "Nước mặn trên trái đất chiếm tỷ lệ bao nhiêu?", "o": ["97%", "2%", "1%", "5%"], "a": [0], "e": "Khoảng 97% nước trên Trái Đất là nước mặn (biển, đại dương); nước ngọt chỉ khoảng 3%."}, {"n": 36, "q": "Tầng khí quyển nào chứa hầu hết các hiện tượng thời tiết?", "o": ["Tầng bình lưu", "Tầng trung quyển", "Tầng đối lưu", "Tầng nhiệt quyển"], "a": [2], "e": "Tầng đối lưu (sát mặt đất) chứa phần lớn hơi nước → mây, mưa, gió… đều diễn ra ở đây."}, {"n": 37, "q": "Thành phần chính của không khí là:", "o": ["O2 và CO2", "O2 và H2", "N2 và O2", "CO2 và CH4"], "a": [2], "e": "Không khí gồm khoảng 78% N2 và 21% O2."}, {"n": 38, "q": "Sinh quyển bao gồm:", "o": ["Toàn bộ khí quyển", "Toàn bộ thủy quyển", "Tầng đối lưu", "Tất cả các sinh vật sống và hệ sinh thái trên Trái đất"], "a": [3], "e": "Sinh quyển là toàn bộ sinh vật sống cùng môi trường sống của chúng trên Trái Đất."}, {"n": 39, "q": "Môi trường cung cấp gì cho sự sống con người?", "o": ["Không khí, nước, lương thực", "Vũ trụ, ngân hà", "Năng lượng nguyên tử", "Các kim loại quý"], "a": [0], "e": "Môi trường cung cấp không khí, nước, lương thực… những thứ thiết yếu cho sự sống."}, {"n": 40, "q": "Sự cố cháy rừng nghiêm trọng tại các bang California  những năm gần đây liên quan đến", "o": ["Ô nhiễm đất", "Suy giảm tầng ozon", "Hạn hán kéo dài do biến đổi khí hậu", "Hoạt động khai thác khoáng sản"], "a": [2], "e": "Biến đổi khí hậu gây nắng nóng, hạn hán kéo dài → cháy rừng ở California ngày càng nghiêm trọng."}, {"n": 41, "q": "Sự suy giảm tầng ozon có thể gây bệnh gì ở người?", "o": ["Sốt xuất huyết", "Đục thủy tinh thể", "Viêm ruột", "Tiểu đường"], "a": [1], "e": "Tầng ozon mỏng đi → tia tử ngoại (UV) xuống mặt đất nhiều hơn → gây đục thủy tinh thể, ung thư da."}, {"n": 42, "q": "Hoạt động nào góp phần lớn vào biến đổi khí hậu?", "o": ["Nông nghiệp hữu cơ", "Du lịch sinh thái", "Đốt nhiên liệu hóa thạch", "Trồng rừng"], "a": [2], "e": "Đốt than, dầu, khí thải ra lượng lớn CO2 – nguyên nhân chính gây biến đổi khí hậu."}, {"n": 43, "q": "Tầng ozon có tác dụng:", "o": ["Tạo mưa", "Hấp thụ tia tử ngoại có hại", "Sản xuất oxy", "Làm tăng nhiệt độ"], "a": [1], "e": "Tầng ozon hấp thụ tia tử ngoại (UV) có hại từ Mặt Trời."}, {"n": 44, "q": "Theo Luật Bảo vệ môi trường 2005, ô nhiễm môi trường được hiểu là gì?", "o": ["Sự xuất hiện của các loại vi sinh vật trong môi trường", "Sự biến đổi của các thành phần môi trường không phù hợp với tiêu chuẩn, gây ảnh hưởng xấu", "Sự thay đổi thời tiết đột ngột gây ảnh hưởng tới sinh hoạt", "Việc phát triển công nghiệp không kiểm soát"], "a": [1], "e": "Luật BVMT 2005: ô nhiễm môi trường là sự biến đổi của thành phần môi trường không phù hợp với tiêu chuẩn môi trường, gây ảnh hưởng xấu đến con người, sinh vật."}, {"n": 45, "q": "Khái niệm “suy thoái môi trường” chỉ điều gì?", "o": ["Sự biến đổi nhiệt độ không khí", "Sự xuất hiện các sinh vật mới trong môi trường", "Sự thay đổi chất lượng và số lượng của thành phần môi trường gây ảnh hưởng xấu", "Tăng trưởng kinh tế vượt mức"], "a": [2], "e": "Suy thoái môi trường là sự suy giảm về chất lượng và số lượng của thành phần môi trường, gây ảnh hưởng xấu."}, {"n": 46, "q": "Sự cố môi trường KHÔNG bao gồm nguyên nhân nào sau đây?", "o": ["Thiên tai như động đất, núi lửa", "Sự cố nhà máy điện hạt nhân", "Hoạt động giáo dục và đào tạo", "Tìm kiếm và khai thác khoáng sản"], "a": [2], "e": "Sự cố môi trường do thiên tai hoặc hoạt động của con người (sự cố công nghiệp, khai khoáng…). Giáo dục – đào tạo không gây sự cố môi trường."}, {"n": 47, "q": "Nguồn gây ô nhiễm không khí lớn nhất ở đô thị là gì?", "o": ["Hoạt động xây dựng", "Giao thông vận tải", "Sinh hoạt dân cư", "Công nghiệp nhẹ"], "a": [1], "e": "Ở đô thị, khí thải và bụi từ xe cộ là nguồn ô nhiễm không khí lớn nhất."}, {"n": 48, "q": "Trong các nguồn phát thải khí CO trên phạm vi toàn quốc, hoạt động nào chiếm tỷ lệ cao nhất?", "o": ["Công nghiệp", "Giao thông vận tải", "Xử lý rác thải", "Nông nghiệp"], "a": [1], "e": "CO sinh ra chủ yếu do đốt nhiên liệu không hoàn toàn trong động cơ xe → giao thông chiếm tỷ lệ cao nhất."}, {"n": 49, "q": "Hiệu ứng nhà kính tự nhiên có vai trò gì đối với Trái Đất?", "o": ["Làm tăng tia tử ngoại bức xạ lên bề mặt đất", "Duy trì nhiệt độ trung bình thích hợp cho sự sống", "Làm tan băng nhanh chóng ở hai cực", "Làm Trái Đất quay nhanh hơn"], "a": [1], "e": "Hiệu ứng nhà kính tự nhiên giữ nhiệt độ trung bình Trái Đất khoảng 15°C; không có nó Trái Đất sẽ khoảng –18°C."}, {"n": 50, "q": "Khí nhà kính có ảnh hưởng lớn nhất đến hiệu ứng nhà kính của trái đất hiện nay là:", "o": ["N2O", "CO2", "CH4", "CFC"], "a": [1], "e": "CO2 có lượng phát thải lớn nhất nên đóng góp nhiều nhất vào hiệu ứng nhà kính hiện nay."}, {"n": 51, "q": "Tầng ozon có vai trò chủ yếu là gì?", "o": ["Duy trì độ ẩm khí quyển", "Tăng khả năng phản xạ ánh sáng", "Hấp thụ bức xạ tử ngoại có hại từ Mặt Trời", "Làm tăng CO2 trong khí quyển"], "a": [2], "e": "Vai trò chủ yếu của tầng ozon: hấp thụ bức xạ tử ngoại có hại từ Mặt Trời."}, {"n": 52, "q": "Mưa axit được định nghĩa là nước mưa có độ pH dưới bao nhiêu?", "o": ["6,5", "6,0", "5,6", "7,0"], "a": [2], "e": "Nước mưa bình thường có pH khoảng 5,6 (do CO2 hòa tan); mưa axit là mưa có pH < 5,6."}, {"n": 53, "q": "Nước bị coi là ô nhiễm khi:", "o": ["Có nhiều phù sa", "Có màu đục tự nhiên", "Thành phần lí – hoá – sinh học bị thay đổi gây hại cho sức khỏe và môi trường", "Có mùi hôi"], "a": [2], "e": "Nước ô nhiễm khi thành phần lý – hóa – sinh bị thay đổi, gây hại cho sức khỏe và môi trường. Phù sa, màu đục tự nhiên chưa chắc là ô nhiễm."}, {"n": 54, "q": "Ưu điểm nổi bật của công cụ kinh tế so với công cụ pháp lý là:", "o": ["Có khả năng xử phạt hiệu quả hơn đối với các hành vi vi phạm.", "Cho phép lựa chọn linh hoạt trong thực hiện nghĩa vụ môi trường.", "Được xây dựng trên cơ sở luật pháp bắt buộc thi hành.", "Tăng cường khả năng kiểm soát hành chính của nhà nước."], "a": [1], "e": "Công cụ kinh tế (thuế, phí, côta…) cho doanh nghiệp tự lựa chọn cách thực hiện nghĩa vụ môi trường → linh hoạt, chi phí thấp. Pháp lý là 'mệnh lệnh – kiểm soát', bắt buộc."}, {"n": 55, "q": "Lựa chọn câu trả lời đúng nhất: Sản xuất sạch hơn (SXSH) giúp giảm chi phí xử lý môi trường bằng cách nào?", "o": ["Áp dụng các công nghệ tiên tiến trong xử lý chất thải giúp giảm lượng chất ô nhiễm trong nước xả ra ngoài môi trường", "Sử dụng hóa chất có độc tính thấp hơn trong xử lý sau cùng để giảm tác động tới môi trường từ các hoá chất đó", "Ngăn ngừa phát sinh chất thải ngay từ nguồn và nâng cao hiệu suất sử dụng nguyên vật liệu", "Quản lý nội vi tốt, tránh gây rò rỉ, rơi vãi, bảo ôn tốt đường ống, giữ môi trường tại nơi làm việc sạch sẽ."], "a": [2], "e": "Sản xuất sạch hơn tập trung NGĂN NGỪA chất thải ngay từ nguồn và dùng nguyên liệu hiệu quả hơn, thay vì xử lý cuối đường ống."}, {"n": 56, "q": "Chọn câu trả lời đúng nhất: Sản xuất sạch hơn bao gồm các giải pháp như sau:", "o": ["Quản lý nội vi tốt, Cải tiến thiết bị, Tuần hoàn tái sử dụng, Thay thế nguyên vật liệu, Cải tiến sản phẩm.", "Quản lý nội vi tốt, Cải tiến thiết bị, Tuần hoàn tái sử dụng, Thay thế nguyên vật liệu, Sản xuất sản phẩm phụ, Kiểm soát quy trình tốt, Thay đổi công nghệ, Cải tiến sản phẩm.", "Quản lý nội vi tốt, Cải tiến thiết bị, Sản xuất sản phẩm phụ, Kiểm soát quy trình tốt, Thay đổi công nghệ, Cải tiến sản phẩm.", "Quản lý nội vi tốt, Thay thế nguyên vật liệu, Sản xuất sản phẩm phụ, Kiểm soát quy trình tốt, Thay đổi công nghệ, Cải tiến sản phẩm."], "a": [1], "e": "Đủ 8 nhóm giải pháp SXSH: quản lý nội vi, kiểm soát quy trình, cải tiến thiết bị, thay đổi công nghệ, thay thế nguyên liệu, tuần hoàn tái sử dụng, sản xuất sản phẩm phụ, cải tiến sản phẩm."}, {"n": 57, "q": "Lịch sử tiếp cận sản xuất sạch hơn trong sản xuất theo tiến trình nào sau đây? (1. Xử lý cuối đường ống; 2. Sinh thái công nghiệp; 3. Khuếch tán và Pha loãng; 4. Giảm thiểu chất thải; 5. Phớt lờ ô nhiễm)", "o": ["2 – 1 – 4 – 3 – 5", "3 – 2 – 1– 5 – 4", "5 – 3 – 1 – 4 – 2", "1 – 2 – 3 – 4 – 5"], "a": [2], "e": "Tiến trình: Phớt lờ ô nhiễm → Pha loãng, khuếch tán → Xử lý cuối đường ống → Giảm thiểu chất thải (SXSH) → Sinh thái công nghiệp."}, {"n": 58, "q": "Khái niệm phát triển bền vững lần đầu tiên được nhắc đến trong báo cáo nào?", "o": ["Tuyên bố Rio về phát triển bền vững", "Tuyên ngôn Stockholm, Thuỵ Điển năm 1972", "Báo cáo “Tương lai chung của chúng ta” (1987)", "Hiến chương Trái Đất về phát triển bền vững"], "a": [2], "e": "Khái niệm phát triển bền vững được phổ biến rộng rãi từ Báo cáo Brundtland 'Tương lai chung của chúng ta' (1987)."}, {"n": 59, "q": "Sự ra đời của khái niệm phát triển bền vững có liên quan đến hội nghị nào sau đây?", "o": ["Hội nghị COP21 tại Paris", "Hội nghị Stockholm 1972", "Hội nghị Kyoto 1997", "Hội nghị Bali 2007"], "a": [1], "e": "Hội nghị Stockholm 1972 (hội nghị môi trường đầu tiên của LHQ) đặt nền móng cho khái niệm phát triển bền vững."}, {"n": 60, "q": "Hội nghị Rio de Janeiro 1992 đã đưa ra văn kiện quan trọng nào?", "o": ["Hiệp định Paris về khí hậu", "Nghị định thư Kyoto về giảm phát thải khí nhà kính", "Chương trình Nghị sự 21 (Agenda 21)", "Báo cáo Brundtland"], "a": [2], "e": "Hội nghị Thượng đỉnh Trái Đất Rio 1992 thông qua Chương trình Nghị sự 21 (Agenda 21)."}, {"n": 61, "q": "Phát triển bền vững hiện nay được hiểu như thế nào trong định hướng phát triển toàn cầu?", "o": ["Chỉ là một xu hướng tạm thời trong phát triển kinh tế toàn cầu và địa phương", "Chỉ áp dụng trong phát triển địa phương", "Là định hướng phổ biến trong phát triển toàn cầu và địa phương", "Là mô hình dành riêng cho các quốc gia phát triển"], "a": [2], "e": "Phát triển bền vững hiện là định hướng phổ biến ở cả cấp toàn cầu và địa phương."}, {"n": 62, "q": "Ba trụ cột của phát triển bền vững thường có mối quan hệ như thế nào trong thực tế?", "o": ["Luôn bổ trợ lẫn nhau một cách hài hòa, thường ít xung đột nên không cần có biện pháp quản lý hợp lý", "Luôn mâu thuẫn với nhau và không thể điều hòa, xung đột với nhau nên rất khó quản lý", "Luôn có mối quan hệ tác động qua lại với nhau, có thể xung đột nếu không được quản lý hợp lý", "Không liên quan trực tiếp đến nhau, các yếu tố hoạt động độc lập không cần có biện pháp quản lý"], "a": [2], "e": "Ba trụ cột kinh tế – xã hội – môi trường tác động qua lại, có thể mâu thuẫn nên cần quản lý hài hòa."}, {"n": 63, "q": "Điểm nổi bật trong định nghĩa của “Brundtland Report” (1987) về phát triển bền vững là gì?", "o": ["Nhấn mạnh vai trò của tăng trưởng GDP", "Tập trung vào quyền lợi của các quốc gia nghèo", "Nhấn mạnh trách nhiệm liên thế hệ trong phát triển", "Ưu tiên cải thiện chất lượng hạ tầng kỹ thuật"], "a": [2], "e": "Brundtland: phát triển đáp ứng nhu cầu hiện tại mà không làm tổn hại khả năng đáp ứng nhu cầu của các thế hệ tương lai → trách nhiệm liên thế hệ."}, {"n": 64, "q": "Câu nào sau đây thuộc về kinh tế vi mô:", "o": ["Các hoạt động diễn ra trong toàn bộ nền kinh tế.", "Hành vi ứng xử của các tế bào kinh tế.", "Mức giá chung của các hàng hoá, dịch vụ.", "Tỷ lệ thất nghiệp."], "a": [1], "e": "Vi mô nghiên cứu hành vi của các tế bào kinh tế (hộ gia đình, doanh nghiệp)."}, {"n": 65, "q": "Kinh tế học vi mô tiếp cận với những nghiên cứu kinh tế dưới góc độ", "o": ["Toàn bộ nền kinh tế", "Chính phủ", "Sự hoạt động của các thị trường riêng lẻ", "Hoạt động của hệ thống ngân hàng"], "a": [2], "e": "Kinh tế vi mô nghiên cứu hoạt động của từng thị trường riêng lẻ."}, {"n": 66, "q": "Khan hiếm là vấn đề:", "o": ["Hiệu quả sản xuất không còn nữa", "Không tồn tại trong các nền kinh tế giàu có", "Số lượng các nguồn lực xác định còn nhu cầu con người là vô hạn", "Nảy sinh khi năng suất tăng chậm lại"], "a": [2], "e": "Khan hiếm: nguồn lực có hạn trong khi nhu cầu con người là vô hạn."}, {"n": 67, "q": "Các nguồn lực kinh tế là khan hiếm cho nên:", "o": ["Phải lựa chọn mục tiêu khi sản xuất", "Chính phủ phải điều tiết nền kinh tế", "Phải mở cửa nền kinh tế", "Sự chênh lệch giàu – nghèo là không tránh khỏi"], "a": [0], "e": "Vì nguồn lực khan hiếm nên phải lựa chọn: sản xuất gì, bao nhiêu."}, {"n": 68, "q": "Đường giới hạn khả năng sản xuất mô tả:", "o": ["Sự kết hợp hàng hóa, dịch vụ được sản xuất khi giá thay đổi", "Khối lượng tối đa của nguồn lực được sử dụng khi tiền lương thay đổi", "Sự kết hợp về hàng hóa và dịch vụ được cầu khi giá thay đổi", "Khối lượng tối đa hàng hóa, dịch vụ có thể sản xuất được với số lượng về nguồn lực và kỹ thuật  cho trước."], "a": [3], "e": "Đường PPF cho biết lượng hàng hóa tối đa có thể sản xuất với nguồn lực và công nghệ cho trước."}, {"n": 69, "q": "Vấn đề nào dưới đây không thuộc vấn đề của kinh tế vĩ mô", "o": ["Các nguyên nhân làm giá cam tăng", "Các nguyên nhân làm gia tăng mức giá bình quân", "Nguyên nhân của sự suy giảm kinh tế", "Việc xác định mức thu nhập quốc dân"], "a": [0], "e": "Giá cam tăng là chuyện của một thị trường riêng lẻ → thuộc vi mô. Mức giá chung, suy thoái, thu nhập quốc dân là vĩ mô."}, {"n": 70, "q": "Nhân tố nào dưới đây làm dịch chuyển đường cung hàng hóa X sang trái:", "o": ["Lương công nhân sản xuất hàng hóa X giảm", "Giá máy móc sản xuất ra hàng hóa X tăng", "Công nghệ sản xuất ra hàng hóa X được cải tiến", "Là tình huống lượng cầu lớn hơn lượng cung"], "a": [1], "e": "Giá máy móc tăng → chi phí sản xuất tăng → cung giảm, đường cung dịch sang trái. Lương giảm, công nghệ cải tiến làm cung tăng (sang phải)."}, {"n": 71, "q": "Lượng cầu tăng có nghĩa là:", "o": ["Dịch chuyển đường cầu sang phải", "Dịch chuyển đường cầu sang trái", "Di chuyển về phía trên (bên trái) đường cầu", "Đường cung không thay đổi"], "a": [0], "e": "Theo đáp án gốc chọn A. Lưu ý lý thuyết: 'cầu tăng' mới là đường cầu dịch phải; 'lượng cầu tăng' chặt chẽ là di chuyển xuống dưới dọc đường cầu (không có trong các phương án)."}, {"n": 72, "q": "Có thể hạn chế dư thừa hàng hóa trên thị trường thông qua:", "o": ["Tăng cung", "Chính phủ tăng giá", "Giảm lượng cầu", "Giảm giá"], "a": [3], "e": "Dư thừa xảy ra khi giá cao hơn giá cân bằng → giảm giá sẽ làm lượng cầu tăng, lượng cung giảm, hết dư thừa."}, {"n": 73, "q": "Cho hình vẽ sau, trong đó điểm E là điểm cân bằng ban đầu của thị trường lương thực còn điểm E’ là điểm cân bằng mới. Yếu tố nào sau đây có thể gây ra sự thay đổi này (đường cầu dịch chuyển từ D sang D’)", "o": ["Giá cả các yếu tố đầu vào tăng", "Thời tiết xấu làm cho đường cung dịch chuyển", "Thu nhập của người tiêu dùng tăng làm cho đường cầu dịch chuyển", "Cả cung và cầu đều dịch chuyển"], "a": [2], "e": "Đường cầu dịch phải từ D sang D’ (cung giữ nguyên) → nguyên nhân phía cầu: thu nhập người tiêu dùng tăng."}, {"n": 74, "q": "Hiện tượng thiếu hụt hàng hóa trên thị trường có nghĩa là:", "o": ["Cầu tăng khi giá tăng", "Lượng cầu lớn hơn lượng cung", "Lượng cung lớn hơn lượng cầu", "Lượng cầu nhỏ hơn lượng cân bằng"], "a": [1], "e": "Thiếu hụt: tại mức giá đang xét, lượng cầu > lượng cung (thường do giá thấp hơn giá cân bằng)."}, {"n": 75, "q": "Hiện tượng dư thừa hàng hóa trên thị trường có nghĩa là:", "o": ["Tồn tại nếu giá cao hơn giá cân bằng", "Là chênh lệch giữa lượng cầu và lượng cung", "Là chênh lệch giữa lượng cầu và lượng cân bằng", "Là chênh lệch giữa lượng cung và lượng cân bằng"], "a": [0], "e": "Dư thừa xảy ra khi giá cao hơn giá cân bằng (lượng cung > lượng cầu)."}, {"n": 76, "q": "Công nghệ sản xuất điện thoại di động tiên tiến hơn sẽ làm cho:", "o": ["Đường cầu dịch chuyển lên trên", "Đường cung dịch chuyển sang trái", "Cả đường cung và đường cầu đều dịch chuyển lên trên", "Đường cung dịch chuyển sang phải."], "a": [3], "e": "Công nghệ tiên tiến làm giảm chi phí → cung tăng → đường cung dịch sang phải."}, {"n": 77, "q": "Chi phí đầu vào để sản xuất ra bánh của công ty A giảm xuống sẽ làm cho:", "o": ["Đường cầu dịch chuyển lên trên", "Đường cung dịch chuyển lên trên", "Cả đường cung và cầu đều dịch chuyển lên trên", "Đường cung dịch chuyển xuống dưới (bên phải)"], "a": [3], "e": "Chi phí đầu vào giảm → cung tăng → đường cung dịch xuống dưới (sang phải)."}, {"n": 78, "q": "Khi cung hàng hóa trên thị trường tăng và cầu hàng hóa trên thị trường giảm thì:", "o": ["Giá cân bằng chắc chắn giảm", "Giá cân bằng chắc chắn tăng", "Giá cân bằng không thay đổi", "Sản lượng cân bằng chắc chắn tăng"], "a": [0], "e": "Cung tăng làm giá giảm, cầu giảm cũng làm giá giảm → giá cân bằng chắc chắn giảm (còn sản lượng thì chưa chắc)."}, {"n": 79, "q": "Khi thu nhập của người tiêu dùng tăng mạnh thì:", "o": ["Cầu về hàng hóa cao cấp tăng", "Cầu về hàng hóa cao cấp giảm", "Cầu về hàng hóa cao cấp không đổi", "Cầu về hàng hóa thứ cấp tăng"], "a": [0], "e": "Hàng cao cấp có cầu tăng mạnh khi thu nhập tăng. Hàng thứ cấp thì ngược lại: thu nhập tăng → cầu giảm."}, {"n": 80, "q": "Cơn bão số 3 năm 2024 tại Việt Nam làm mất rất nhiều diện tích nuôi trồng thủy sản có thể sẽ:", "o": ["Gây ra sự vận động dọc theo đường cung thủy sản ở Việt Nam tới mức giá cao hơn", "Gây ra cầu tăng làm cho giá thủy sản cao hơn", "Làm cho cầu đối với thủy sản giảm xuống", "Làm cho đường cung thủy sản Việt Nam dịch chuyển lên trên sang trái"], "a": [3], "e": "Bão phá hủy diện tích nuôi trồng → cung thủy sản giảm → đường cung dịch lên trên, sang trái."}, {"n": 81, "q": "Khi giá hàng hoá Y: PY = 4 thì lượng cầu hàng hoá X là QX = 15 và khi PY = 6 thì QX = 17, với điều kiện các yếu tố khác không đổi X và Y là 2 hàng hoá:", "o": ["Thay thế cho nhau.", "Vừa thay thế vừa bổ sung cho nhau.", "Bổ sung cho nhau", "Không liên quan."], "a": [0], "e": "Giá Y tăng (4 → 6) mà lượng cầu X tăng (15 → 17) → người mua chuyển từ Y sang X → X và Y là hàng thay thế."}, {"n": 82, "q": "Cầu hàng hoá X (X là hàng hoá thông thường) tăng khi:", "o": ["Công nghệ sản xuất hàng hoá X thay đổi.", "Giá của hàng hoá X tăng.", "Thu nhập người tiêu dùng tăng.", "Có nhiều người cung ứng mới xuất hiện trên thị trường."], "a": [2], "e": "Với hàng thông thường, thu nhập tăng → cầu tăng. Giá X tăng chỉ làm giảm lượng cầu; công nghệ, người bán mới là yếu tố của cung."}, {"n": 83, "q": "Hạn hán sẽ:", "o": ["Gây ra sự vận động dọc theo đường cung lúa gạo với giá cao hơn.", "Làm cho cầu tăng dẫn đến giá lúa gạo cao hơn.", "Làm cho cầu đối với lúa gạo giảm.", "Làm cho đường cung lúa gạo dịch chuyển lên trên, sang trái."], "a": [3], "e": "Hạn hán làm giảm sản lượng lúa → cung giảm → đường cung dịch lên trên, sang trái."}, {"n": 84, "q": "Một hãng không thể ảnh hưởng đến giá sản phẩm mà mình bán ra gọi là:", "o": ["Người đặt giá", "Người chấp nhận giá.", "Người ra quyết định hợp lý", "Người điều tiết giá"], "a": [1], "e": "Hãng không ảnh hưởng được giá thị trường là người chấp nhận giá (đặc trưng của cạnh tranh hoàn hảo)."}, {"n": 85, "q": "Cung về máy fax phụ thuộc vào nhiều yếu tố, nhân tố nào sau đây không làm dịch chuyển đường cung máy fax?", "o": ["Tiền lương công nhân tăng.", "Giá máy fax tăng.", "Chi phí sản xuất máy fax tăng.", "Chính phủ đánh thuế ngành kinh doanh máy fax."], "a": [1], "e": "Giá của chính máy fax chỉ làm di chuyển dọc đường cung. Lương, chi phí, thuế làm dịch chuyển đường cung."}, {"n": 86, "q": "Yếu tố nào sau đây không phải là yếu tố ảnh hưởng đến cầu hàng hoá dịch vụ:", "o": ["Thị hiếu, sở thích của người tiêu dùng.", "Các yếu tố đầu vào sản xuất.", "Giá cả hàng hoá liên quan.", "Thu nhập của người tiêu dùng."], "a": [1], "e": "Yếu tố đầu vào sản xuất ảnh hưởng đến CUNG, không phải cầu."}, {"n": 87, "q": "Khoản mục nào sau đây không được tính một cách trực tiếp trong GDP của nước ta theo cách tiếp cận chi tiêu", "o": ["Dịch vụ giúp việc mà một gia đình thuê.", "Dịch vụ tư vấn luật mà một gia đình thuê.", "Sợi bông mà công ty dệt 8-3 mua và dệt thành vải.", "Giáo trình bán cho sinh viên."], "a": [2], "e": "Sợi bông dùng để dệt vải là hàng TRUNG GIAN → không tính trực tiếp vào GDP (tránh tính trùng)."}, {"n": 88, "q": "Khoản mục nào sau đây được tính một cách trực tiếp trong GDP theo cách tiếp cận chi tiêu", "o": ["Công việc nội trợ.", "Hoạt động mua bán ma tuý bất hợp pháp.", "Giá trị hàng hóa trung gian.", "Dịch vụ tư vấn."], "a": [3], "e": "Dịch vụ tư vấn là dịch vụ cuối cùng, giao dịch hợp pháp trên thị trường → tính vào GDP. Việc nội trợ, ma túy, hàng trung gian không tính."}, {"n": 89, "q": "Những khoản mục nào sau đây sẽ được tính vào GDP của năm nay?", "o": ["Máy in mới sản xuất ra trong năm nay được một công ty xuất bản mua.", "Máy tính cá nhân sản xuất trong năm trước được một sinh viên mua để chuẩn bị cho kỳ thi học kỳ.", "Một chiếc ôtô mới được nhập khẩu từ nước ngoài.", "Nhà máy giày Thượng Đình vừa xuất khẩu một lô hàng được sản xuất từ năm trước."], "a": [0], "e": "GDP năm nay chỉ tính hàng SẢN XUẤT trong năm nay, trong lãnh thổ. Máy in sản xuất năm nay được mua để đầu tư → tính. Hàng năm trước, hàng nhập khẩu thì không."}, {"n": 90, "q": "Câu nào bình luận về GDP nào sau đây là sai?", "o": ["GDP có thể được tính bằng cách sử dụng giá cả hiện hành hoặc giá cả năm gốc.", "Cả hàng hoá trung gian và hàng hoá cuối cùng đều được tính vào GDP.", "Chỉ tính những hàng hóa và dịch vụ được sản xuất ra trong thời kỳ nghiên cứu.", "GDP không tính các hàng hóa và dịch vụ nhập khẩu."], "a": [1], "e": "GDP chỉ tính hàng cuối cùng; tính cả hàng trung gian là sai (tính trùng)."}, {"n": 91, "q": "Câu nào dưới đây phản ánh sự khác nhau giữa GDP danh nghĩa và GDP thực tế?", "o": ["GDP thực tế chỉ bao gồm hàng hoá, trong khi GDP danh nghĩa bao gồm cả hàng hóa và dịch vụ.", "GDP thực tế được tính theo giá cố định của năm gốc, trong khi GDP danh nghĩa được tính theo giá hiện hành.", "GDP thực tế bằng GDP danh nghĩa trừ đi khấu hao.", "GDP thực tế bằng GDP danh nghĩa nhân với chỉ số điều chỉnh GDP."], "a": [1], "e": "GDP thực tế tính theo giá năm gốc; GDP danh nghĩa tính theo giá hiện hành."}, {"n": 92, "q": "Nếu tốc độ tăng trưởng của cung tiền cao hơn tốc độ tăng trưởng của sản lượng thực, điều gì sẽ xảy ra?", "o": ["Lạm phát có xu hướng tăng", "Tỷ lệ thất nghiệp giảm", "GDP thực tăng nhanh", "Cán cân thương mại thặng dư"], "a": [0], "e": "Tiền tăng nhanh hơn hàng hóa → 'nhiều tiền đuổi theo ít hàng' → lạm phát tăng."}, {"n": 93, "q": "Nếu lạm phát cao hơn kỳ vọng, nhóm nào dưới đây có khả năng được lợi nhất?", "o": ["Người gửi tiền tại ngân hàng", "Người vay tiền dài hạn với lãi suất cố định", "Người làm công ăn lương cố định", "Người về hưu sống bằng trợ cấp xã hội"], "a": [1], "e": "Lạm phát cao hơn dự kiến làm giá trị thực của khoản nợ giảm → người đi vay với lãi suất cố định được lợi."}, {"n": 94, "q": "Điều nào sau đây không phải là nguyên nhân gây ra lạm phát chi phí đẩy?", "o": ["Giá nguyên liệu đầu vào tăng", "Tăng thuế gián thu", "Lương tối thiểu tăng", "Tổng cầu tăng mạnh"], "a": [3], "e": "Tổng cầu tăng gây lạm phát CẦU KÉO. Chi phí đẩy do giá đầu vào, thuế gián thu, tiền lương tăng."}, {"n": 95, "q": "Điều gì xảy ra nếu những người thất nghiệp lâu năm ngừng tìm kiếm việc làm?", "o": ["Tỷ lệ thất nghiệp tăng", "Lực lượng lao động tăng", "Tỷ lệ thất nghiệp giảm", "Sản lượng tiềm năng tăng"], "a": [2], "e": "Người ngừng tìm việc bị loại khỏi lực lượng lao động → số người thất nghiệp giảm → tỷ lệ thất nghiệp giảm."}, {"n": 96, "q": "Một sinh viên mới tốt nghiệp đang tích cực tìm việc nhưng chưa có việc làm, được xếp vào loại thất nghiệp nào?", "o": ["Thất nghiệp cơ cấu", "Thất nghiệp tạm thời (frictional)", "Thất nghiệp chu kỳ", "Không tính là thất nghiệp"], "a": [1], "e": "Sinh viên mới ra trường đang tìm việc là thất nghiệp tạm thời (thời gian tìm kiếm, chuyển việc)."}, {"n": 97, "q": "Xuất khẩu ròng (NX) âm khi nào?", "o": ["Xuất khẩu lớn hơn so với nhập khẩu", "Nhập khẩu bằng xuất khẩu", "Xuất khẩu nhỏ hơn so với nhập khẩu", "Khi tiêu dùng cho xuất khẩu tăng lên"], "a": [2], "e": "NX = Xuất khẩu – Nhập khẩu; NX âm khi xuất khẩu nhỏ hơn nhập khẩu."}, {"n": 98, "q": "Những khoản mục nào sau đây sẽ được tính vào GDP năm nay?", "o": ["Máy tính mới sản xuất ra trong năm nay được một công ty xuất bản mua.", "Máy tính cá nhân sản xuất trong năm trước được một sinh viên mua để chuẩn bị cho kỳ thi học kỳ.", "Một chiếc Máy bay mới được nhập khẩu từ nước ngoài.", "Nhà máy thép vừa xuất khẩu một lô hàng được sản xuất từ năm trước."], "a": [0], "e": "Chỉ hàng sản xuất trong năm nay, trong nước được tính vào GDP năm nay: máy tính mới sản xuất năm nay."}, {"n": 99, "q": "GDP thực khác với GDP danh nghĩa ở điểm nào?", "o": ["GDP thực không bao gồm thuế", "GDP thực đã điều chỉnh theo lạm phát", "GDP thực không bao gồm sản phẩm dịch vụ", "GDP thực chỉ tính hàng xuất khẩu"], "a": [1], "e": "GDP thực tế đã loại bỏ ảnh hưởng của lạm phát (tính theo giá năm gốc)."}, {"n": 100, "q": "Khoản mục nào sau đây được tính một cách trực tiếp trong GDP theo cách tiếp cận chi tiêu?", "o": ["Công việc nội trợ.", "Hoạt động mua bán ma tuý bất hợp pháp", "Giá trị hàng hóa trung gian.", "Dịch vụ tư vấn."], "a": [3], "e": "Dịch vụ tư vấn là dịch vụ cuối cùng hợp pháp → tính vào GDP."}, {"n": 101, "q": "Nguyên nhân nào sau đây không phải là nguyên nhân trực tiếp gây ra thất nghiệp?", "o": ["Sự phát triển của khoa học kỹ thuật", "Khủng hoảng kinh tế", "Thiếu hụt nguồn lao động", "Doanh nghiệp phá sản"], "a": [2], "e": "Thiếu hụt lao động thì doanh nghiệp thiếu người làm, không phải nguyên nhân gây thất nghiệp."}, {"n": 102, "q": "Khi nền kinh tế lâm vào tình trạng suy thoái, dạng thất nghiệp phổ biến nhất là:", "o": ["Thất nghiệp tạm thời", "Thất nghiệp cơ cấu", "Thất nghiệp chu kỳ", "Thất nghiệp tự nguyện"], "a": [2], "e": "Suy thoái làm giảm cầu lao động → thất nghiệp chu kỳ tăng mạnh nhất."}, {"n": 103, "q": "Thất nghiệp ảnh hưởng tiêu cực đến xã hội như thế nào?", "o": ["Làm giảm giá cả hàng hoá", "Làm tăng thu nhập người dân", "Gây bất ổn xã hội và giảm mức sống", "Tăng số lượng trường học"], "a": [2], "e": "Thất nghiệp làm giảm thu nhập, mức sống, dễ gây tệ nạn và bất ổn xã hội."}, {"n": 104, "q": "Nguyên nhân chủ yếu gây ra lạm phát là?", "o": ["Chính sách tiền tệ thắt chặt", "Giảm chi tiêu của chính phủ", "Tăng cung tiền quá mức", "Tăng nhập hẩu nhiên liệu"], "a": [2], "e": "Nguyên nhân chủ yếu của lạm phát: cung tiền tăng quá mức so với lượng hàng hóa. Thắt chặt tiền tệ, giảm chi tiêu thì giảm lạm phát."}, {"n": 105, "q": "Lạm phát chi phí đẩy xảy ra khi:", "o": ["Cầu hàng hoá tăng nhanh hơn cung", "Ngân hàng Trung ương bơm tiền vào nền kinh tế", "Chi phí sản xuất tăng làm cho giá thành sản xuất tăng", "Đồng tiền mất giá do chính sách tỷ giá"], "a": [2], "e": "Lạm phát chi phí đẩy: chi phí sản xuất tăng → giá thành tăng → giá bán tăng. Cầu tăng nhanh hơn cung là cầu kéo."}, {"n": 106, "q": "GDP đo lường", "o": ["Tổng giá trị hàng hóa xuất khẩu của một quốc gia trong một năm", "Tổng giá trị tài sản cố định của một quốc gia", "Tổng giá trị hàng hóa và dịch vụ cuối cùng được sản xuất trong lãnh thổ một quốc gia trong một thời kỳ nhất định", "Tổng thu nhập của người dân trong một quốc gia"], "a": [2], "e": "GDP là tổng giá trị hàng hóa, dịch vụ cuối cùng sản xuất trong lãnh thổ một quốc gia trong một thời kỳ."}, {"n": 107, "q": "Vai trò của khí quyển trong bảo vệ sự sống là:", "o": ["Tạo ánh sáng", "Cản tia tử ngoại và điều hòa nhiệt độ", "Phát ra CO2", "Hấp thụ bụi"], "a": [1], "e": "Khí quyển (tầng ozon) cản tia tử ngoại và giữ nhiệt, điều hòa nhiệt độ Trái Đất."}, {"n": 108, "q": "Tầng ozon bị đe dọa chủ yếu do:", "o": ["CO2", "CFC", "O2", "Nước"], "a": [1], "e": "CFC (dùng trong tủ lạnh, điều hòa, bình xịt cũ) phá hủy ozon mạnh nhất."}, {"n": 109, "q": "Diện tích rừng thế giới mất đi chủ yếu do:", "o": ["Tăng độ ẩm", "Khai thác củi và làm nông nghiệp", "Phun thuốc trừ sâu", "Gió mạnh"], "a": [1], "e": "Rừng mất chủ yếu do khai thác gỗ, củi và phá rừng làm nông nghiệp."}, {"n": 110, "q": "Tài nguyên thủy sản toàn cầu hiện nay:", "o": ["Ổn định", "Gia tăng", "Suy giảm mạnh", "Không thay đổi"], "a": [2], "e": "Khai thác quá mức và ô nhiễm biển làm nguồn thủy sản toàn cầu suy giảm mạnh."}, {"n": 111, "q": "Chất ô nhiễm nào thường xuất hiện từ rác thải điện tử?", "o": ["O3", "Kim loại nặng", "N2", "CO"], "a": [1], "e": "Rác thải điện tử chứa nhiều kim loại nặng: chì, thủy ngân, cadimi…"}, {"n": 112, "q": "Giai đoạn tuyệt chủng sinh học đang diễn ra nhanh hơn do:", "o": ["Núi lửa", "Động đất", "Khai thác và phát triển của con người", "Biến động từ mặt trời"], "a": [2], "e": "Tốc độ tuyệt chủng hiện nay tăng nhanh do con người khai thác, phá hủy môi trường sống."}, {"n": 114, "q": "Nguồn nước ngọt bị khủng hoảng do:", "o": ["Tăng mưa", "Tăng băng tuyết", "Sử dụng quá mức và ô nhiễm", "Gió mùa"], "a": [2], "e": "Nước ngọt khủng hoảng vì con người sử dụng quá mức và làm ô nhiễm nguồn nước."}, {"n": 115, "q": "Tác động từ hoạt động sản xuất kinh tế:", "o": ["Tăng đa dạng sinh học", "Phát thải chất thải vào môi trường", "Tăng băng tuyết", "Giảm dân số"], "a": [1], "e": "Sản xuất kinh tế thải chất thải (khí, lỏng, rắn) vào môi trường."}, {"n": 116, "q": "Sinh quyển KHÔNG bao gồm:", "o": ["Động vật", "Hệ sinh thái", "Nhà máy nhiệt điện", "Vi khuẩn"], "a": [2], "e": "Nhà máy nhiệt điện là công trình nhân tạo, không phải thành phần sinh quyển. Động vật, vi khuẩn, hệ sinh thái thì có."}, {"n": 117, "q": "Tác hại của rác thải nhựa đến sinh vật biển:", "o": ["Làm tăng số lượng", "Tạo môi trường sống", "Gây chết do mắc nghẹn hoặc ngộ độc", "Không ảnh hưởng"], "a": [2], "e": "Sinh vật biển nuốt hoặc mắc vào rác nhựa → nghẹn, ngộ độc, chết."}, {"n": 118, "q": "Cơ quan quốc tế quản lý môi trường của liên hợp quốc là:", "o": ["WHO", "FAO", "UNEP", "ILO"], "a": [2], "e": "UNEP là Chương trình Môi trường Liên Hợp Quốc. WHO: y tế; FAO: lương thực; ILO: lao động."}, {"n": 119, "q": "Biến đổi khí hậu dẫn đến sự thay đổi nào của hệ sinh thái trên trái đất:", "o": ["Làm gia tăng sinh khối của hệ sinh thái rừng", "Ổn định khí hậu tại 2 cực của trái đất", "Dịch chuyển các đới khí hậu trên trái đất", "Phân phối tài nguyên"], "a": [2], "e": "Biến đổi khí hậu làm các đới khí hậu dịch chuyển (về phía cực, lên cao) → hệ sinh thái thay đổi theo."}, {"n": 120, "q": "Biến đổi khí hậu có thể làm:", "o": ["Giảm nhiệt độ trung bình toàn cầu", "Dâng mực nước biển", "Tăng độ ẩm không khí", "Giảm phát thải khí nhà kính"], "a": [1], "e": "Nhiệt độ tăng → băng tan, nước biển nở ra → mực nước biển dâng."}, {"n": 121, "q": "Hít phải khí SO2 với nồng độ cao có thể gây ra hiện tượng gì?", "o": ["Suy tim", "Tổn thương gan", "Co thắt phế quản", "Tổn thương thận"], "a": [2], "e": "SO2 kích thích đường hô hấp, gây co thắt phế quản, khó thở."}, {"n": 122, "q": "Các chất gây ô nhiễm trong luyện kim bao gồm:", "o": ["Hơi nước và khí CO2", "CO và khí amoniac", "SO2, NOx, bụi, hơi kim loại độc hại", "Oxy và khí nitơ"], "a": [2], "e": "Luyện kim thải SO2, NOx, bụi và hơi kim loại độc (chì, kẽm…)."}, {"n": 123, "q": "Trong nông nghiệp, khí thải CH4 và H2S phát sinh chủ yếu từ hoạt động nào?", "o": ["Phân hủy phân động vật", "Phun thuốc trừ sâu", "Tưới tiêu bằng nước giếng", "Bón phân hóa học"], "a": [0], "e": "Phân động vật phân hủy yếm khí sinh ra CH4 (mê-tan) và H2S (mùi trứng thối)."}, {"n": 124, "q": "Tác hại của chì đối với trẻ em là:", "o": ["Gây ra tình trạng suy tim", "Gây rối loạn tiêu hóa", "Gây nhiễm độc thần kinh, chậm phát triển trí tuệ", "Gây ra tình trạng suy hô hấp"], "a": [2], "e": "Chì gây độc hệ thần kinh, làm trẻ chậm phát triển trí tuệ."}, {"n": 125, "q": "Nước thải y tế nguy hiểm vì chứa:", "o": ["Chất dinh dưỡng", "Chất hoạt động bề mặt", "Vi sinh vật gây bệnh, hóa chất", "Kim loại nặng"], "a": [2], "e": "Nước thải y tế chứa vi sinh vật gây bệnh và hóa chất độc → lây bệnh, nguy hiểm."}, {"n": 126, "q": "Ô nhiễm đất do chiến tranh là do:", "o": ["Bom đạn chưa nổ", "Mảnh kim loại", "Tồn lưu hóa chất diệt cỏ chứa Dioxin", "Chất thải nhựa"], "a": [2], "e": "Chất diệt cỏ chứa dioxin (chất độc da cam) tồn lưu lâu dài trong đất sau chiến tranh."}, {"n": 127, "q": "Biện pháp hiệu quả để hạn chế ô nhiễm đất do rác thải là:", "o": ["Đốt toàn bộ rác thải", "Chôn lấp không phân loại", "Phân loại, tái chế và xử lý chất hữu cơ", "Ủ phân compost"], "a": [2], "e": "Hiệu quả và bền vững nhất là phân loại, tái chế và xử lý chất hữu cơ, thay vì đốt hay chôn lấp không phân loại."}, {"n": 128, "q": "Hậu quả chung của ô nhiễm nước là:", "o": ["Làm mất mỹ quan khu dân cư", "Gây bệnh, đột biến gen và suy giảm hệ sinh thái", "Làm phá hủy thủy vực", "Gây mùi hôi thối"], "a": [1], "e": "Nước ô nhiễm gây bệnh cho người, có thể gây đột biến gen và làm suy giảm hệ sinh thái."}, {"n": 129, "q": "Lượng nước thải sinh hoạt của mỗi người trong ngày phụ thuộc chủ yếu vào:", "o": ["Giới tính và độ tuổi", "Nhiệt độ môi trường", "Mức sống và lối sống", "Nguồn cấp nước"], "a": [2], "e": "Lượng nước thải sinh hoạt phụ thuộc chủ yếu vào mức sống và lối sống: sống càng cao, dùng nước càng nhiều."}, {"n": 130, "q": "Một trong những đặc điểm nguy hiểm của chất dioxin là:", "o": ["Dễ phân hủy ở nhiệt độ thường", "Làm ô nhiễm không khí", "Có thể tồn tại lâu dài trong môi trường và cơ thể sống", "Ảnh hưởng đến chuỗi thức ăn"], "a": [2], "e": "Dioxin rất bền, khó phân hủy, tích tụ lâu dài trong môi trường và cơ thể sống."}, {"n": 131, "q": "Chất hữu cơ dễ phân hủy sinh học trong nước thải chủ yếu là:", "o": ["Nitrat và phosphat", "Protein, carbohydrate, lipid", "Xyanua và phenol", "Các ion kim loại"], "a": [1], "e": "Chất hữu cơ dễ phân hủy sinh học: protein, carbohydrate, lipid. Phenol, xyanua là chất độc khó phân hủy."}, {"n": 132, "q": "Tác động phức hợp của nước ô nhiễm lên môi trường thể hiện rõ nhất qua:", "o": ["Sự phát sinh mùi hôi từ nước", "Sự thay đổi hệ sinh thái toàn vùng", "Sự thay đổi màu nước và độ pH", "Sự bốc hơi nhanh của nước"], "a": [1], "e": "Nước ô nhiễm ảnh hưởng đồng thời đến đất, sinh vật, không khí → làm thay đổi hệ sinh thái cả vùng."}, {"n": 133, "q": "Tác động của nước ô nhiễm đến môi trường không khí chủ yếu thông qua quá trình nào?", "o": ["Sự thẩm thấu khí độc qua đất", "Sự bay hơi của nước mang theo vi sinh vật và hóa chất độc", "Sự phản ứng của kim loại trong nước với oxy không khí", "Sự bốc mùi của các hợp chất kiềm mạnh"], "a": [1], "e": "Nước ô nhiễm bay hơi mang theo vi sinh vật và hóa chất độc vào không khí."}, {"n": 134, "q": "Điểm giống nhau cơ bản giữa thuế môi trường và côta ô nhiễm là gì?", "o": ["Đều do người tiêu dùng cuối cùng chi trả", "Đều là các khoản đóng góp tự nguyện", "Đều nhằm điều tiết hành vi gây ô nhiễm thông qua cơ chế tài chính", "Đều chỉ áp dụng cho chất thải rắn"], "a": [2], "e": "Thuế môi trường và côta ô nhiễm đều là công cụ kinh tế: dùng cơ chế tài chính để điều chỉnh hành vi gây ô nhiễm."}, {"n": 135, "q": "Lựa chọn câu trả lời đúng nhất: Nguyên nhân dẫn đến sản xuất sạch hơn vẫn chưa được áp dụng một cách triệt để tại Việt Nam:", "o": ["Do thói quen của người lao động Việt Nam không phù hợp với sản xuất sạch hơn", "Do năng lực để thực hiện sản xuất sạch hơn trong các doanh nghiệp còn nhiều hạn chế", "Do hoạt động sản xuất kinh doanh chưa đủ quy mô để thực hiện sản xuất sạch hơn", "Do chưa có thỏa thuận giữa đơn vị sản xuất và cơ quan chức năng trong thực hiện hoạt động sản xuất"], "a": [1], "e": "SXSH chưa phổ biến ở Việt Nam chủ yếu do năng lực (vốn, kỹ thuật, nhân lực) của doanh nghiệp còn hạn chế."}, {"n": 136, "q": "Phương pháp thiêu đốt thường không hiệu quả cho loại chất thải nào dưới đây?", "o": ["Chất thải hữu cơ", "Chất thải dung môi, chất thải không phân hủy sinh học", "Chất thải rắn bị nhiễm khuẩn bởi các vi sinh vật gây bệnh truyền nhiễm, nguy hiểm", "Chất thải y tế"], "a": [0], "e": "Chất thải hữu cơ thường ẩm, nhiệt trị thấp → đốt không hiệu quả; phù hợp ủ phân hoặc xử lý sinh học hơn."}, {"n": 137, "q": "Hãy lựa chọn đáp án đúng nhất: ưu điểm của phương pháp thiêu đốt chất thải rắn:", "o": ["Khả năng tận dụng được nhiệt, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, xử lý triệt để thành phần ô nhiễm.", "Vận hành đòi hỏi rác có nhiệt trị cao, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, xử lý triệt để thành phần ô nhiễm.", "Khả năng tận dụng được nhiệt, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, có thể gặp khó khăn khi có sự thay đổi về thành phần chất thải.", "Khả năng tận dụng được nhiệt, xử lý được toàn bộ chất thải rắn mà không cần nhiều diện tích đất, loại bỏ được nhiều chất độc hại, xử lý triệt để thành phần ô nhiễm, chi phí đầu tư và bảo trì thấp so với các phương pháp khác"], "a": [0], "e": "Ưu điểm của thiêu đốt: tận dụng nhiệt, ít tốn đất, loại bỏ chất độc, xử lý triệt để. Các phương án khác lẫn nhược điểm (cần rác nhiệt trị cao, khó khăn khi thành phần thay đổi, chi phí cao)."}, {"n": 138, "q": "Trong sinh thái công nghiệp (STCN), chất thải của một doanh nghiệp có thể trở thành:", "o": ["Sản phẩm phụ bỏ đi", "Chứng từ môi trường", "Nguyên liệu đầu vào của doanh nghiệp khác", "Chứng cứ xử phạt hành chính"], "a": [2], "e": "Sinh thái công nghiệp: chất thải của doanh nghiệp này là nguyên liệu đầu vào của doanh nghiệp khác."}, {"n": 139, "q": "Nhãn sinh thái tác động đến hành vi nào trong chuỗi sản xuất – tiêu dùng?", "o": ["Hành vi đầu tư của ngân hàng", "Quyết định lựa chọn nguyên vật liệu của nhà cung cấp", "Hành vi tiêu dùng của người dân và định hướng sản xuất của doanh nghiệp", "Lựa chọn phương pháp xử lý nước thải của chính quyền địa phương"], "a": [2], "e": "Nhãn sinh thái giúp người tiêu dùng chọn sản phẩm thân thiện môi trường → doanh nghiệp phải sản xuất xanh hơn."}, {"n": 140, "q": "Một trong những rào cản lớn nhất của Sinh thái công nghiệp (STCN) là:", "o": ["Thiếu ngân sách đầu tư công nghệ cao và các điều kiện để xây dựng khu STCN", "Mối quan hệ phụ thuộc giữa các doanh nghiệp khiến rủi ro tăng cao", "Không có chính sách pháp luật về bảo vệ môi trường khuyến khích việc xây dựng khu STCN", "Thiếu nguồn nhân lực chất lượng cao và kinh nghiệm trong việc xây dựng khu STCN"], "a": [0], "e": "Rào cản lớn của sinh thái công nghiệp là cần nhiều vốn đầu tư, công nghệ cao và điều kiện hạ tầng."}, {"n": 141, "q": "Tại sao không thể sử dụng một chỉ số duy nhất để đánh giá tính bền vững của một lĩnh vực?", "o": ["Vì chỉ số duy nhất không đủ độ tin cậy, cần có nhiều chỉ số mới đánh giá đầy đủ được", "Vì sự phát triển bền vững là một khái niệm không định lượng, cần có nhiều chỉ số mới đánh giá đầy đủ được", "Vì tính bền vững cần được đánh giá tổng hợp từ nhiều khía cạnh định lượng và định tính", "Vì tính bền vững cần được đánh giá từ một số khía cạnh định lượng và định tính"], "a": [2], "e": "Bền vững gồm nhiều khía cạnh (kinh tế, xã hội, môi trường; định lượng và định tính) nên phải đánh giá tổng hợp nhiều chỉ số."}, {"n": 142, "q": "So sánh hai quốc gia có cùng GDP nhưng quốc gia A có cơ cấu GDP nghiêng về dịch vụ và công nghiệp, còn quốc gia B nghiêng về nông nghiệp. Quốc gia nào có khả năng tăng trưởng bền vững hơn về kinh tế và vì sao?", "o": ["Quốc gia A, vì dịch vụ và công nghiệp có khả năng sinh lợi cao hơn", "Quốc gia B, vì nông nghiệp ổn định hơn, đảm bảo an ninh lượng thực giúp đảm bảo ổn định của xã hội", "Cả hai như nhau vì có cùng GDP", "Quốc gia B, vì phù hợp với nước đang phát triển"], "a": [0], "e": "Dịch vụ và công nghiệp có giá trị gia tăng, khả năng sinh lợi cao hơn nông nghiệp → tăng trưởng kinh tế bền vững hơn."}, {"n": 143, "q": "Nếu một quốc gia duy trì tốc độ tăng trưởng GDP cao nhưng cơ cấu GDP phụ thuộc vào khai thác tài nguyên không tái tạo, đánh giá nào sau đây là chính xác nhất?", "o": ["Quốc gia này phát triển không toàn diện chưa đạt phát triển bền vững", "Quốc gia đạt bền vững kinh tế nhưng chưa đạt bền vững về môi trường", "Quốc gia này có rủi ro thiếu bền vững về kinh tế trong dài hạn", "Quốc gia đạt bền vững về môi trường nhưng chưa đạt bền vững về kinh tế"], "a": [2], "e": "Dựa vào tài nguyên không tái tạo thì khi tài nguyên cạn sẽ khó tăng trưởng → rủi ro thiếu bền vững về kinh tế trong dài hạn."}, {"n": 144, "q": "Chỉ số HDI là tổng hợp của các yếu tố nào sau đây?", "o": ["Tuổi thọ, học vấn, thu nhập bình quân theo đô la Mỹ", "Tuổi thọ, trình độ học vấn, PPP/người", "GDP, GNP, PPP/người", "Y tế, giáo dục, công nghệ"], "a": [1], "e": "HDI gồm 3 thành phần: tuổi thọ, giáo dục và thu nhập bình quân đầu người tính theo sức mua tương đương (PPP)."}, {"n": 145, "q": "Điểm tương đồng giữa chỉ số Gini và chỉ số HDI trong việc đánh giá tính bền vững xã hội là gì?", "o": ["Cả hai đều phản ánh mức thu nhập quốc dân", "Cả hai đều liên quan đến bất bình đẳng xã hội", "Cả hai đều do Liên Hợp Quốc xây dựng", "Cả hai đều đo khả năng tiếp cận y tế của người dân"], "a": [1], "e": "Gini đo bất bình đẳng thu nhập; HDI phản ánh mức phát triển con người. Cả hai đều dùng để đánh giá công bằng – bất bình đẳng xã hội."}, {"n": 146, "q": "Lựa chọn đáp án chính xác nhất: Tính bền vững về kinh tế được hiểu là", "o": ["Khai thác tối đa các nguồn tài nguyên để phát triển", "Tăng trưởng nhanh bằng mọi giá", "Tăng trưởng cao và ổn định, sử dụng hiệu quả tài nguyên", "Giảm chi tiêu ngân sách"], "a": [2], "e": "Bền vững kinh tế: tăng trưởng cao, ổn định và sử dụng tài nguyên hiệu quả, không phải tăng trưởng bằng mọi giá."}, {"n": 147, "q": "So sánh chỉ số NCI của Việt Nam và Thái Lan giúp ta rút ra kết luận gì?", "o": ["Việt Nam có diện tích bảo tồn lớn hơn Thái Lan", "Việt Nam có hệ thống giáo dục về môi trường tốt hơn Thái Lan", "Thái Lan có chỉ số GDP cao hơn", "Việt Nam có mức độ đa dạng sinh học và bảo tồn tốt hơn Thái Lan"], "a": [3], "e": "NCI (chỉ số vốn tự nhiên) phản ánh mức độ đa dạng sinh học và bảo tồn hệ sinh thái → so sánh cho thấy nước nào bảo tồn tốt hơn."}, {"n": 148, "q": "Tại sao đầu tư thích đáng cho bảo vệ môi trường được xem là chỉ tiêu của phát triển bền vững kinh tế?", "o": ["Vì nó giúp giảm nợ công quốc gia, tăng trưởng kinh tế dài hạn", "Vì chi phí môi trường có ảnh hưởng dài hạn đến tăng trưởng kinh tế", "Vì chỉ số này được yêu cầu trong cam kết quốc tế", "Vì nó làm tăng tỷ lệ thất nghiệp tạm thời"], "a": [1], "e": "Chi phí môi trường (ô nhiễm, cạn kiệt tài nguyên) ảnh hưởng lâu dài đến tăng trưởng → đầu tư bảo vệ môi trường là chỉ tiêu của bền vững kinh tế."}, {"n": 149, "q": "Chênh lệch GDP giữa các vùng trong một quốc gia phản ánh điều gì về tính bền vững kinh tế - xã hội?", "o": ["Mức độ đầu tư phát triển dịch vụ và công bằng xã hội giữa các vùng", "Khả năng cân đối ngân sách quốc gia", "Mức độ phát triển đồng đều và công bằng xã hội giữa các vùng", "Sự thay đổi cơ cấu dân số"], "a": [2], "e": "Chênh lệch GDP giữa các vùng cho thấy mức độ phát triển có đồng đều và công bằng xã hội giữa các vùng hay không."}, {"n": 150, "q": "Kinh tế học liên quan đến những nghiên cứu sâu rộng là làm thế nào để:", "o": ["Quyền lực chính trị được sử dụng một cách có hiệu quả", "Các nguồn lực được phân bổ để thỏa mãn tối đa nhu cầu của con người", "Tạo sự phù hợp giữa những thực phẩm và những lợi ích khác mà ngân sách gia đình bạn phải sử dụng", "Những đồng tiền khác nhau phụ thuộc vào nhau trong một hệ thống nhất"], "a": [1], "e": "Kinh tế học nghiên cứu cách phân bổ nguồn lực để thỏa mãn tối đa nhu cầu con người."}, {"n": 151, "q": "Đường giới hạn khả năng sản xuất không mô tả điều nào dưới đây:", "o": ["Sự khan hiếm", "Những nhu cầu bị giới hạn", "Chi phí cơ hội", "Sự lựa chọn bị ràng buộc"], "a": [1], "e": "PPF thể hiện khan hiếm, chi phí cơ hội, lựa chọn bị ràng buộc. Nhu cầu con người là VÔ HẠN, không bị giới hạn."}, {"n": 152, "q": "Giả sử có sự lựa chọn khác là đi làm thì chi phí cơ hội của việc học đại học là:", "o": ["Học phí", "Chỉ gồm học phí và chi phí về sách vở", "Chỉ gồm tiền lương bị bỏ qua nếu không đi làm", "Học phí cộng với chi phí học tập khác và tiền lương bị bỏ qua"], "a": [3], "e": "Chi phí cơ hội gồm mọi thứ phải bỏ ra hoặc từ bỏ: học phí, chi phí học tập và tiền lương lẽ ra kiếm được nếu đi làm."}, {"n": 154, "q": "Minh có thể lựa chọn đi xem phim hay đi chơi tennis. Nếu như Minh quyết định đi xem phim thì giá trị của việc chơi tennis là:", "o": ["Lớn hơn giá trị của xem phim", "Không so sánh được với giá trị của xem phim", "Bằng giá trị của việc xem phim", "Là chi phí cơ hội của việc xem phim"], "a": [3], "e": "Giá trị của phương án tốt nhất bị bỏ qua (chơi tennis) chính là chi phí cơ hội của lựa chọn đã chọn (xem phim)."}, {"n": 155, "q": "Cho phương trình đường cầu P = 120 – Q và phương trình đường cung P = 10 + Q. Nếu thu nhập của người tiêu dùng tăng lên, làm cho lượng cầu tăng lên 20 đơn vị tại mỗi mức giá. Tính giá cả và sản lượng cân bằng:", "o": ["PE’ = 65; QE’ = 65", "PE’ = 75; QE’ = 55", "PE’ = 75; QE’ = 65", "PE’ = 75; QE’ = 75"], "a": [2], "e": "Cầu mới: Q = 120 – P + 20 = 140 – P. Cung: Q = P – 10. Cho bằng nhau: 140 – P = P – 10 → P = 75; Q = 65."}, {"n": 156, "q": "Đồ thị cung – cầu: tại giá P = 4, lượng cung = 200, lượng cầu = 400. Khi giá là 4 thì tổng doanh thu là:", "o": ["1000", "1200", "1500", "800"], "a": [3], "e": "Giá 4 thấp hơn giá cân bằng → chỉ bán được lượng nhỏ hơn giữa cung và cầu, tức 200. TR = P × Q = 4 × 200 = 800."}, {"n": 157, "q": "Có số liệu về cung và cầu một loại hàng hoá trên thị trường. Viết phương trình đường cầu của hàng hoá: [Giá: 20, 40, 60, 80, 100 | Lượng cầu: 100, 80, 60, 40, 20 | Lượng cung: 10, 30, 50, 70, 90]", "o": ["P = 120 – Q hay Q = 120 - P", "P = 100 – Q hay Q = 100 - P", "P = 110 – Q hay Q = 110 - P", "P = 130 – Q hay Q = 130 – P"], "a": [0], "e": "Từ bảng: P = 20 thì Q = 100; P = 40 thì Q = 80 → giá tăng 20, lượng giảm 20 → Q = a – P. Thay P = 20, Q = 100 → a = 120 → Q = 120 – P."}, {"n": 158, "q": "Cho hàm cầu P = 18,5 – 0,5Q và hàm cung P = 2 + 0,5Q. Nếu chính phủ đánh thuế 1 nđ/tấn trên mỗi đơn vị sản phẩm bán ra trên thị trường. Hãy xác định giá và sản lượng cân bằng mới của thị trường sau khi có thuế:", "o": ["PE = 10,75;  QE = 15,5", "PE = 10,75;  QE = 16,5", "PE  = 11,75;  QE = 15,5", "PE  = 10,75;  QE = 14,5"], "a": [0], "e": "Thuế 1 đánh vào người bán: cung mới P = 3 + 0,5Q. Cho 18,5 – 0,5Q = 3 + 0,5Q → Q = 15,5; P = 18,5 – 7,75 = 10,75."}, {"n": 159, "q": "Có số liệu về cung cầu máy khâu trên thị trường. Tính lượng thiếu hụt thị trường tại mức giá P = 5: [Giá: 5, 10, 15, 20, 25, 30 | Lượng cầu: 100, 90, 80, 70, 60, 50 | Lượng cung: 40, 50, 60, 70, 80, 90]", "o": ["40", "60", "20", "50"], "a": [1], "e": "Tại P = 5: lượng cầu = 100, lượng cung = 40 → thiếu hụt = 100 – 40 = 60."}, {"n": 160, "q": "Có số liệu về cung cầu máy khâu trên thị trường. Tính lượng dư thừa thị trường tại mức giá P = 25: [Giá: 5, 10, 15, 20, 25, 30 | Lượng cầu: 100, 90, 80, 70, 60, 50 | Lượng cung: 40, 50, 60, 70, 80, 90]", "o": ["60", "40", "20", "50"], "a": [2], "e": "Tại P = 25: lượng cung = 80, lượng cầu = 60 → dư thừa = 80 – 60 = 20."}, {"n": 161, "q": "Thị trường sản phẩm A có hàm cung và cầu như sau: Ps = 10 +Qs và Pd = 100 - Qd Nếu nhà nước đánh thuế 10 đơn vị giá/sản phẩm, xác định phần thuế mà người sản xuất phải chịu trên một đơn vị sản phẩm:", "o": ["4 đơn vị giá/sản phẩm", "5 đơn vị giá /sản phẩm", "6 đơn vị giá /sản phẩm", "7 đơn vị giá /sản phẩm"], "a": [1], "e": "Trước thuế: 100 – Q = 10 + Q → Q = 45, P = 55. Sau thuế: 100 – Q = 20 + Q → Q = 40, P = 60. Người mua chịu 60 – 55 = 5 → người bán chịu 10 – 5 = 5."}, {"n": 162, "q": "Thị trường sản phẩm A có hàm cung và cầu như sau: Ps = 10 +Qs và Pd = 100 - Qd Nếu nhà nước đánh thuế 10 đơn vị giá/sản phẩm, xác định phần thuế mà người tiêu dùng phải chịu trên một sản phẩm:", "o": ["4 đơn vị giá /sản phẩm", "5 đơn vị giá /sản phẩm", "6 đơn vị giá /sản phẩm", "7 đơn vị giá /sản phẩm"], "a": [1], "e": "Giá người mua trả tăng từ 55 lên 60 → người tiêu dùng chịu 5 đơn vị/sản phẩm (độ dốc cung và cầu bằng nhau nên chia đều)."}, {"n": 163, "q": "Thị trường sản phẩm A có hàm cung và cầu như sau: Ps = 10 +Qs và Pd = 100 - Qd Nếu nhà nước đánh thuế 10 đơn vị giá /sản phẩm, xác định điểm cân bằng mới:", "o": ["PE = 60; QE = 40", "PE = 65; QE = 40", "PE = 60; QE = 45", "PE = 65; QE = 35"], "a": [0], "e": "Cung sau thuế: P = 20 + Q. Cho 100 – Q = 20 + Q → Q = 40; P = 60."}, {"n": 164, "q": "Cho đường cung P = 0,5Q + 1,5 và đường cầu P = 27 - Q. Khi giá bị áp đặt là 11,5 nghìn đồng/đơn vị, doanh thu là bao nhiêu?", "o": ["TR = 170 triệu đồng", "TR = 162 triệu đồng", "TR = 140 triệu đồng", "TR = 178,25 triệu đồng"], "a": [3], "e": "Cân bằng: 0,5Q + 1,5 = 27 – Q → Q = 17, P = 10. Giá áp đặt 11,5 > 10 → chỉ bán được theo lượng cầu Q = 27 – 11,5 = 15,5 → TR = 11,5 × 15,5 = 178,25."}, {"n": 165, "q": "Yếu tố nào sau đây sẽ làm dịch chuyển đường cầu rượu vang sang phải", "o": ["Thu nhập tăng.", "Giảm giá rượu sâm-panh (hàng hoá thay thế).", "Giảm giá rượu vang.", "Tăng giá bắp rang bơ (hàng hoá bổ sung)."], "a": [0], "e": "Thu nhập tăng (rượu vang là hàng thông thường) → cầu tăng → đường cầu dịch phải. Giá rượu vang giảm chỉ là di chuyển dọc đường cầu."}, {"n": 166, "q": "Nếu giá của hàng hoá bổ sung của sản phẩm X tăng lên, các yếu tố khác không đổi thì:", "o": ["Lượng cầu sản phẩm X giảm xuống.", "Lượng cầu sản phẩm X tăng lên.", "Phần chi tiêu cho sản phẩm X tăng lên.", "Đường cầu sản phẩm X dịch chuyển sang trái."], "a": [3], "e": "Giá hàng bổ sung tăng → người ta mua ít cả hai → cầu X giảm → đường cầu X dịch sang trái."}, {"n": 167, "q": "Cho hàm cung, hàm cầu của một hàng hoá A lần lượt như sau: QD = -0,4P + 28, QS = 0,6P -6. Giá và lượng cân bằng trên thị trường là bao nhiêu?", "o": ["PE =34; QE =14,4", "PE =34; QE =10", "PE =30; QE =12", "PE =30; QE =14"], "a": [0], "e": "–0,4P + 28 = 0,6P – 6 → P = 34; Q = 0,6×34 – 6 = 14,4."}, {"n": 168, "q": "Nếu mức sản xuất không thay đổi, trong khi giá cả của mọi hàng hoá đều tăng gấp đôi, khi đó:", "o": ["Cả GDP danh nghĩa và GDP thực tế đều không thay đổi.", "GDP thực tế không đổi, trong khi GDP danh nghĩa giảm một nửa", "GDP thực tế không đổi, còn GDP danh nghĩa tăng gấp đôi.", "GDP thực tế tăng gấp đôi, còn GDP danh nghĩa không đổi."], "a": [2], "e": "Sản lượng không đổi → GDP thực tế không đổi; giá gấp đôi → GDP danh nghĩa gấp đôi."}, {"n": 169, "q": "GDP thực tế đo lường theo mức giá ___________, còn GDP danh nghĩa đo lường theo mức giá ___________", "o": ["Năm hiện hành, năm cơ sở.", "Năm cơ sở, năm hiện hành.", "Của hàng hóa trung gian, của hàng hóa cuối cùng", "Quốc tế, trong nước."], "a": [1], "e": "GDP thực tế tính theo giá năm cơ sở; GDP danh nghĩa tính theo giá năm hiện hành."}, {"n": 170, "q": "Giả sử có số liệu của một nước như sau: Tổng sản phẩm quốc nội=800; Chi tiêu, tiêu dùng cá nhân=450; Chi tiêu của chính phủ =120; Xuất khẩu =80; Nhập khẩu=30. Hỏi Mức đầu tư là bao nhiêu?", "o": ["180", "280", "770", "380"], "a": [0], "e": "I = GDP – C – G – NX = 800 – 450 – 120 – (80 – 30) = 180."}, {"n": 171, "q": "Dưới đây là số liệu rút ra từ hệ thống tài khoản quốc gia của một nước: Tổng sản phẩm quốc dân=2000; Các khoản chi tiêu tiêu dùng=950; Khấu hao=450; Thu nhập ròng từ tải sản nước ngoài=300; Các khoản tiết kiệm=200. Hãy cho biết sản phẩm quốc dân ròng bằng bao nhiêu?", "o": ["1700", "1550", "1150", "1200"], "a": [1], "e": "NNP = GNP – Khấu hao = 2000 – 450 = 1550."}, {"n": 172, "q": "Giả sử có số liệu sau: Sản phẩm quốc dân ròng=1800; Thuế gián thu=150; Khấu hao=150; Thuế trực thu=90; Trợ cấp cho sản xuất=50. Hãy cho biết thu nhập quốc dân bằng bao nhiêu?", "o": ["1650", "1710", "1950", "2000"], "a": [0], "e": "Thu nhập quốc dân Y = NNP – Thuế gián thu = 1800 – 150 = 1650."}, {"n": 173, "q": "Dưới đây là số liệu rút ra từ hệ thống tài khoản quốc gia của một nước: Tổng sản phẩm quốc dân=2000; Các khoản chi tiêu tiêu dùng=850; Khấu hao=500; Thu nhập ròng từ tải sản nước ngoài=300; Các khoản tiết kiệm=200. Hãy cho biết sản phẩm quốc dân ròng bằng bao nhiêu?", "o": ["1700", "1500", "1150", "1200"], "a": [1], "e": "NNP = GNP – Khấu hao = 2000 – 500 = 1500."}, {"n": 174, "q": "Giả sử có số liệu một nước như sau: Tổng sản phẩm quốc nội=800; Chi tiêu tiêu dùng cá nhân=450; Chi tiêu của chính phủ=120; Xuất khẩu =80; nhập khẩu 30. Hãy cho biết Mức đầu tư bằng bao nhiêu?", "o": ["180", "200", "280", "230"], "a": [0], "e": "I = GDP – C – G – NX = 800 – 450 – 120 – 50 = 180."}, {"n": 175, "q": "Dưới dây là số liệu rút ra từ hệ thống tài khoản quốc gia của một nước: Tổng sản phẩm quốc dân=1500; Thuế đánh vào các khoản chi tiêu=750; Khấu hao=350; Thu nhập ròng từ tài sản nước ngoài=150; Trợ cấp cho sản xuất =120. Hỏi Tổng sản phẩm quốc nội bằng bao nhiêu?", "o": ["1350", "1150", "1200", "1650"], "a": [0], "e": "GDP = GNP – NPI = 1500 – 150 = 1350."}, {"n": 176, "q": "Giả sử số liệu của một nước như sau: Đầu tư =500; Chi tiêu tiêu dùng cá nhân=1200; Chi tiêu của chính phủ=30; Xuất khẩu ròng=40; Sản phẩm quốc dân ròng=1500. Giả sử thu nhập ròng từ tài sản nước ngoài =350 thì tổng sản phẩm quốc dân bằng bao nhiều?", "o": ["120", "3270", "3150", "3700"], "a": [1], "e": "Câu này đề có vấn đề: theo công thức GNP = C + I + G + NX + NPI = 1200 + 500 + 30 + 40 + 350 = 2120, không trùng phương án nào. Đáp án B (3270) được chọn theo cách cộng thêm NNP; nên hỏi lại giảng viên."}, {"n": 177, "q": "Giả sử có số liệu sau: Tổng sản phẩm quốc dân =2500 USD; Các khoản chi tiêu tiêu dùng=1400 USD; Đầu tư 150 USD; Chi tiêu của chính phủ=300; Thu nhập ròng từ tài sản nước ngoài=500 USD. Hãy cho biết tổng sản phẩm quốc nội bằng bao nhiêu?", "o": ["2000", "2500", "500", "3000"], "a": [0], "e": "GDP = GNP – NPI = 2500 – 500 = 2000."}, {"n": 178, "q": "Giả sử có số liệu sau: Tổng sản phẩm quốc dân =2500 USD; Các khoản chi tiêu tiêu dùng=1400 USD; Đầu tư 150 USD; Chi tiêu của chính phủ=300; Thu nhập ròng từ tài sản nước ngoài=500 USD. Hãy cho biết xuất khẩu ròng bằng bao nhiêu?", "o": ["2000", "1500", "350", "150"], "a": [3], "e": "GDP = 2000 → NX = GDP – C – I – G = 2000 – 1400 – 150 – 300 = 150."}, {"n": 179, "q": "Giả sử có số liệu sau: Tổng sản phẩm quốc nội =800; Sản phẩm quốc dân ròng=1500; Thuế trực thu =90; Các khoản trợ cấp=50. Giả sử thu nhập ròng từ tài sản nước ngoài =250 thì tổng sản phẩm quốc dân bằng bao nhiêu?", "o": ["1500", "1050", "400", "710"], "a": [1], "e": "GNP = GDP + NPI = 800 + 250 = 1050."}, {"n": 180, "q": "Giả sử có số liệu sau: Tổng sản phẩm quốc nội =800; Sản phẩm quốc dân ròng=1500; Thuế trực thu =90; Các khoản trợ cấp=50. Giả sử thuế gián thu bằng 230 thì thu nhập quốc dân bằng bao nhiêu?", "o": ["1270", "1300", "150", "1500"], "a": [0], "e": "Y = NNP – Thuế gián thu = 1500 – 230 = 1270."}, {"n": 181, "q": "Giả sử có số liệu sau: Tổng sản phẩm quốc dân =1500; Khấu hao=100; Thuế gián thu =150; Thu nhập ròng từ tải sản nước ngoài=300. Cho biết tổng sản phẩm quốc nội bằng bao nhiêu?", "o": ["1400", "1250", "1350", "1200"], "a": [3], "e": "GDP = GNP – NPI = 1500 – 300 = 1200."}, {"n": 182, "q": "Giả sử một nền kinh tế có: Tổng sản phẩm quốc nội GDP = 1500, tiêu dùng của các hộ gia đình C=800, Chi tiêu của chính phủ G=200, Đầu tư I = 350, Xuất Khẩu X = 250. Hãy cho biết nhập khẩu của nền kinh tế là bao nhiêu?", "o": ["80", "100", "110", "150"], "a": [1], "e": "GDP = C + I + G + X – M → M = 800 + 350 + 200 + 250 – 1500 = 100."}, {"n": 183, "q": "Sau khi Nghị định thư Montreal được thông qua vào năm 1987, điều nào sau đây là kết quả đáng chú ý nhất?", "o": ["Nồng độ CO₂ trong khí quyển giảm mạnh", "Khí CFC gần như được loại bỏ hoàn toàn", "Tầng ozon bị suy giảm nhanh hơn", "Các quốc gia rút khỏi hiệp định vì chi phí cao"], "a": [1], "e": "Nghị định thư Montreal cấm dần các chất phá hủy ozon → CFC gần như bị loại bỏ hoàn toàn."}, {"n": 184, "q": "Khu vực nào tại Việt Nam bị tác động mạnh bởi nước biển dâng?", "o": ["Tây Nguyên", "Đồng bằng sông Hồng", "Đồng bằng sông Cửu Long", "Bắc Trung Bộ"], "a": [2], "e": "Đồng bằng sông Cửu Long thấp, giáp biển → chịu tác động nước biển dâng, xâm nhập mặn mạnh nhất."}, {"n": 185, "q": "Theo các dự báo từ Nghị định thư Montreal, tầng ozon có thể phục hồi hoàn toàn về mức trước những năm 1980 vào khoảng năm nào?", "o": ["2025", "2035", "2040", "2050"], "a": [2], "e": "Dự báo theo Nghị định thư Montreal: tầng ozon (đa số khu vực) phục hồi về mức trước 1980 vào khoảng năm 2040."}, {"n": 186, "q": "Nguyên nhân chính gây hoang mạc hóa:", "o": ["Động đất", "Khai thác rừng và đất không hợp lý", "Tăng diện tích rừng", "Băng tan"], "a": [1], "e": "Hoang mạc hóa chủ yếu do phá rừng, khai thác đất quá mức, canh tác không hợp lý."}, {"n": 187, "q": "Theo mô hình tổng chất thải W thì Wp là:", "o": ["Chất thải từ khai thác tài nguyên", "Chất thải từ hoạt động tiêu dùng", "Chất thải từ hoạt động sản xuất", "Chất thải tái chế được"], "a": [2], "e": "Trong mô hình tổng chất thải: Wp là chất thải từ sản xuất (production)."}, {"n": 188, "q": "Quá trình nào xảy ra thường xuyên trong tầng bình lưu làm mỏng tầng ozon?", "o": ["Phân rã CO₂", "Tăng nồng độ khí oxi", "Hình thành và phân hủy khí ozon", "Kết tụ bụi và nước"], "a": [2], "e": "Trong tầng bình lưu, ozon liên tục được hình thành và phân hủy; khi chất như CFC đẩy nhanh phân hủy thì tầng ozon mỏng đi."}, {"n": 189, "q": "Thái Bình Dương chiếm tỷ lệ phần trăm diện tích bao nhiêu?", "o": ["23,38%", "46,91%", "20,87%", "3,97%"], "a": [1], "e": "Thái Bình Dương chiếm khoảng 46,9% diện tích các đại dương – lớn nhất thế giới."}, {"n": 190, "q": "Đại dương nào có diện tích lớn nhất trong các đại dương?", "o": ["Đại Tây Dương", "Ấn Độ Dương", "Thái Bình Dương", "Bắc Băng Dương"], "a": [2], "e": "Thái Bình Dương là đại dương lớn nhất."}, {"n": 191, "q": "Ranh giới trên của tầng đối lưu ở vùng xích đạo nằm ở độ cao nào?", "o": ["7–8 km", "10–12 km", "13–15 km", "16–18 km"], "a": [3], "e": "Tầng đối lưu dày nhất ở xích đạo, khoảng 16–18 km; ở hai cực chỉ khoảng 7–8 km."}, {"n": 192, "q": "Theo mô hình tổng chất thải W, công thức đúng là:", "o": ["W = Wr – Wp – Wc", "W = Wp × Wc × Wr", "W = Wp + Wc + Wr", "W = (Wp + Wc) ÷ Wr"], "a": [2], "e": "Tổng chất thải W = Wr (khai thác tài nguyên) + Wp (sản xuất) + Wc (tiêu dùng)."}, {"n": 193, "q": "Vai trò “lưu trữ và cung cấp thông tin” của môi trường liên quan chặt chẽ đến hoạt động nào sau đây?", "o": ["Phát triển đô thị và cơ sở hạ tầng", "Nghiên cứu dự báo thiên tai, thời tiết", "Tái chế chất thải hữu cơ", "Khai thác tài nguyên khoáng sản"], "a": [1], "e": "Môi trường lưu trữ và cung cấp thông tin (lịch sử Trái Đất, tín hiệu thời tiết…) giúp nghiên cứu, dự báo thiên tai, thời tiết."}, {"n": 194, "q": "Tại sao nước thải từ ngành công nghiệp thực phẩm lại gây ra hiện tượng phú dưỡng mạnh mẽ hơn so với nước thải từ ngành cơ khí?", "o": ["Vì có hàm lượng kim loại nặng cao hơn", "Vì chứa nhiều vi khuẩn gây bệnh hơn", "Vì chứa nhiều chất hữu cơ dễ phân hủy và chất dinh dưỡng như N, P", "Vì có pH cao hơn mức trung bình"], "a": [2], "e": "Nước thải thực phẩm giàu chất hữu cơ và N, P → tảo phát triển mạnh → phú dưỡng."}, {"n": 195, "q": "Phương pháp xử lý chất thải rắn sinh hoạt phổ biến hiện nay ở nước ta nay là:", "o": ["Thiêu đốt", "Chôn lấp hợp vệ sinh", "Ủ phân bón", "Tái chế, tái sử dụng"], "a": [1], "e": "Ở Việt Nam, phần lớn rác sinh hoạt vẫn được xử lý bằng chôn lấp."}, {"n": 196, "q": "Vai trò của oxy hòa tan trong tự làm sạch nước là:", "o": ["Làm tăng độ đục", "Giúp phản ứng oxi hóa khử xảy ra", "Giúp sa lắng các chất rắn", "Giúp giảm nhiệt độ nước"], "a": [1], "e": "Oxy hòa tan giúp vi sinh vật hiếu khí oxy hóa, phân hủy chất hữu cơ → nước tự làm sạch."}, {"n": 197, "q": "Phương pháp xử lý nào sau đây được ưu tiên áp dụng cho chất thải phóng xạ?", "o": ["Chôn lấp hợp vệ sinh", "Ủ compost", "Đốt ở nhiệt độ cao", "Tái chế, tái sử dụng"], "a": [0], "e": "Chất thải phóng xạ không thể đốt, ủ hay tái chế → phải chôn lấp, cách ly an toàn lâu dài. A là phương án gần đúng nhất."}, {"n": 198, "q": "Biện pháp nào dưới đây không có tác dụng giảm ô nhiễm nước từ nông nghiệp?", "o": ["Giảm sử dụng phân hóa học", "Trồng rừng đầu nguồn", "Xây dựng thêm nhà máy thủy điện", "Thiết lập vùng đệm sinh thái"], "a": [2], "e": "Thủy điện không giúp giảm ô nhiễm nước từ nông nghiệp. Giảm phân hóa học, trồng rừng đầu nguồn, vùng đệm thì có tác dụng."}, {"n": 199, "q": "Việc cấp giấy phép xả thải (côta ô nhiễm) hiệu quả nhất khi nào?", "o": ["Khi có rất nhiều doanh nghiệp cần thải cùng một loại chất ô nhiễm", "Khi chính quyền muốn thu thêm ngân sách", "Khi không thể kiểm tra chất lượng nước thải", "Khi chất ô nhiễm không có khả năng xử lý"], "a": [0], "e": "Côta (giấy phép xả thải có thể mua bán) hiệu quả khi có nhiều doanh nghiệp cùng thải một loại chất ô nhiễm → hình thành thị trường mua bán giấy phép."}, {"n": 200, "q": "Một trong những công cụ quản lý môi trường trong các biện pháp bảo vệ môi trường phi kỹ thuật là:", "o": ["Đặt cọc hoàn trả", "Côta ô nhiễm", "Nhãn sinh thái", "Tiêu chuẩn ISO 14001"], "a": [1], "e": "Côta ô nhiễm (giấy phép xả thải có thể mua bán) là công cụ kinh tế điển hình, không dùng biện pháp kỹ thuật. Đặt cọc hoàn trả, nhãn sinh thái cũng là công cụ phi kỹ thuật, nhưng côta là đáp án tiêu biểu nhất."}, {"n": 201, "q": "Một trong những rào cản lớn nhất trong việc kiểm soát ô nhiễm tại các làng nghề là:", "o": ["Thiếu nguồn vốn đầu tư xây dựng, lắp đặt hệ thống xử lý ô nhiễm môi trường", "Thiếu chính sách hỗ trợ từ nhà nước", "Thiếu quỹ đất để xây dựng, lắp đặt hệ thống xử lý ô nhiễm môi trường", "Thiếu sự hợp tác giữa các hộ
